.place-card{border:1px solid var(--border);border-radius:16px;padding:14px;margin:10px 0;background:var(--card)}.place-head{display:flex;gap:10px;align-items:center}.place-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.place-actions a{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:12px;padding:9px 12px;text-decoration:none;font-size:13px;font-weight:650}.place-meta{font-size:13px;color:var(--muted);margin:5px 0}.mapframe{width:100%;height:280px;border:0;border-radius:16px;background:var(--bg)}.tabnote{padding:10px;border-radius:12px;background:var(--bg);color:var(--muted);font-size:13px}.nav{overflow-x:auto;justify-content:flex-start}.nav button{min-width:58px} .category-panel{border:1px solid var(--border);border-radius:16px;margin:12px 0;overflow:hidden;background:var(--card)}.category-panel>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;min-height:68px}.category-panel>summary::-webkit-details-marker{display:none}.category-label{display:flex;flex-direction:column;gap:5px;min-width:0}.category-label small{color:var(--muted);font-size:.82rem}.category-chevron{font-size:1.4rem;color:var(--accent);transition:transform .2s}.category-panel[open] .category-chevron{transform:rotate(180deg)}.category-content{padding:0 12px 12px;border-top:1px solid var(--border)}.wishlist-row{align-items:flex-start}.item-name{background:none;border:0;color:var(--ink);font:inherit;font-weight:700;text-align:left;padding:3px 0;text-decoration:underline;text-decoration-color:var(--border);overflow-wrap:anywhere}.purchase-toggle{display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;font-size:.85rem;font-weight:600}.purchase-toggle input{width:22px;height:22px;accent-color:var(--accent);margin:0;flex-shrink:0}@media(max-width:480px){.wishlist-row{gap:8px}.wishlist-row .stack button{padding:8px;font-size:.78rem}.category-content{padding-left:8px;padding-right:8px}} </style></head><body><main class="app"><header><div><div class="muted">YOUR PERSONAL TRAVEL COMPANION</div><h1>Trip List ✨</h1></div><button class="secondary" id="themeButton" aria-label="Change theme">🎨 Theme</button></header><div id="view"></div></main><button class="fab" id="quick" aria-label="Quick add">+</button><nav class="nav" id="nav" aria-label="Main navigation"></nav><dialog id="modal"><form id="entryForm"><h2 id="modalTitle"></h2><div id="fields" class="stack"></div><div class="row between"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" id="submit">Save</button></div></form></dialog><dialog class="gallery" id="gallery" aria-label="Photo viewer"><div class="gallery-inner"><div class="gallery-top"><strong id="galleryTitle">Photos</strong><button type="button" id="galleryClose" aria-label="Close gallery">✕</button></div><div class="gallery-stage" id="galleryStage"><button type="button" class="gallery-arrow" id="galleryPrev" aria-label="Previous photo">‹</button><img id="galleryImage" alt="Uploaded image"><button type="button" class="gallery-arrow" id="galleryNext" aria-label="Next photo">›</button></div><div class="gallery-bottom"><span id="galleryPosition"></span><span>Swipe to browse</span></div></div></dialog><dialog id="quickMenu"><h2>What would you like to add? 💜</h2><p class="muted">Choose anything — shopping, activities, bookings, or spending.</p><div class="grid" id="quickChoices"></div><div class="row" style="margin-top:12px"><button type="button" class="secondary" id="quickClose">Close</button></div></dialog><input type="file" id="restoreInput" accept="application/json,.json" hidden><script>
'use strict';
const DB='trip-list-v3',VERSION=1,STORE='records',MAX_FILE=5*1024*1024,MAX_BACKUP=35*1024*1024;
let db,view='home',state={settings:{budget:3400,tripDate:'',tripEndDate:'',dailyFoodMYR:80,cashJPY:0,cashMYR:0,wiseMYR:0,theme:'lavender'},stores:[],categories:[],items:[],expenses:[],packing:[],notes:[],preparations:[],places:[],rate:null},editing=null,modalKind='',rateStatus='Not fetched';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,c='MYR')=>new Intl.NumberFormat('en-MY',{style:'currency',currency:c,maximumFractionDigits:c==='JPY'?0:2}).format(Number(n)||0);
const num=n=>Number.isFinite(Number(n))?Number(n):0,uid=()=>crypto.randomUUID(),today=()=>new Date().toLocaleDateString('en-CA');
const validPhoto=v=>typeof v==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v);
const pictures=(record,key)=>[...(Array.isArray(record?.[key+'s'])?record[key+'s']:[]),...(validPhoto(record?.[key])?[record[key]]:[])].filter(validPhoto);
const wishlistTotal=items=>items.filter(x=>x.status!=='Skipped').reduce((sum,x)=>sum+calcRM(num(x.price)*num(x.qty||1),x.currency),0);
const totalDisplay=(value,label)=>`<div class="total-line"><span>${esc(label)}</span><strong>${money(value)}</strong></div>`;
const fields={store:[['name','Store name','text'],['budget','Store budget (RM)','number']],category:[['storeId','Store','store'],['name','Category name','text']],item:[['storeId','Store','store'],['categoryId','Category','category'],['name','Item name','text'],['price','Unit price','number'],['currency','Currency','currency'],['qty','Quantity','number'],['status','Status','status'],['image','Item photo','image'],['notes','Notes','textarea']],expense:[['store','Store / merchant','text'],['date','Purchase date','date'],['amount','Amount','number'],['currency','Currency','currency'],['category','Expense category','text'],['method','Payment method / money source','method'],['itemId','Linked wishlist item (optional)','item'],['receipt','Receipt photo','image'],['notes','Notes','textarea']],preparation:[['name','To prepare / book','text'],['estimated','Estimated amount','number'],['actual','Actual amount (optional)','number'],['currency','Currency','currency'],['status','Preparation status','prepstatus'],['due','Due date','date'],['notes','Notes','textarea']],place:[['name','Place / experience name','text'],['group','Group (e.g. USJ, Kyoto, Shopping)','text'],['type','Type','placetype'],['date','Visit date (optional)','dateoptional'],['time','Time (optional)','time'],['status','Plan status','placestatus'],['estimated','Estimated cost','number'],['currency','Currency','currency'],['address','Address / map search','text'],['latitude','Latitude (optional)','coordinate'],['longitude','Longitude (optional)','coordinate'],['image','Photos','image'],['notes','Notes / booking details','textarea']],packing:[['name','Packing item','text'],['packed','Packed','check']],note:[['title','Title','text'],['body','Details','textarea']],settings:[['budget','Total trip budget (RM)','number'],['tripDate','Departure date','date'],['tripEndDate','Return date','date'],['dailyFoodMYR','Daily food budget (RM)','number'],['cashJPY','Starting cash in Japan (JPY)','number'],['cashMYR','Starting cash in Malaysia (MYR)','number'],['wiseMYR','Starting Wise balance (RM equivalent)','number']]};
function openDb(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readDb(){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function save(){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(state,'data');t.oncomplete=resolve;t.onerror=()=>reject(t.error||new Error('Storage failed'));t.onabort=()=>reject(t.error||new Error('Storage aborted'))})}
function normalize(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Invalid backup');const result={settings:{...state.settings,...raw.settings}};for(const key of ['stores','categories','items','expenses','packing','notes','preparations','places']){if(!Array.isArray(raw[key]??(['preparations','places'].includes(key)?[]:null))||(raw[key]??[]).length>10000)throw Error('Invalid '+key);result[key]=(raw[key]??[]).map(x=>{if(!x||typeof x!=='object'||typeof x.id!=='string'||x.id.length>100)return (()=>{throw Error('Invalid record')})();return {...x}})}if(raw.rate&&typeof raw.rate==='object'&&num(raw.rate.value)>0)result.rate=raw.rate;else result.rate=null;return result}
function calcRM(amount,currency){return currency==='JPY'?(state.rate?.value?num(amount)*state.rate.value:0):num(amount)}
function spent(){return state.expenses.reduce((s,x)=>s+calcRM(x.amount,x.currency),0)}
function storeName(id){return state.stores.find(x=>x.id===id)?.name||'Unassigned'}
function categoryName(id){return state.categories.find(x=>x.id===id)?.name||'Uncategorized'}
function imageTag(data,cl='thumb'){return typeof data==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(data)?`<img class="${cl}" src="${data}" alt="Uploaded photo">`:`<div class="${cl}" style="display:grid;place-items:center">🛍️</div>`}
function button(action,id,label,klass='secondary'){return `<button type="button" class="${klass} small" data-action="${esc(action)}" data-id="${esc(id)}">${esc(label)}</button>`}
function nav(){const tabs=[['home','⌂','Home'],['places','📍','Places'],['shop','🛍','Shop'],['convert','⇄','Convert'],['expenses','▤','Spent'],['ready','✈','Ready'],['more','☰','More']];$('nav').innerHTML=tabs.map(([id,icon,label])=>`<button data-view="${id}" class="${view===id?'active':''}"><span>${icon}</span>${label}</button>`).join('')}
function render(){nav();const views={home:homeView,places:placesView,shop:shopView,convert:convertView,expenses:expenseView,ready:readyView,more:moreView};$('view').innerHTML=views[view]();if(view==='convert')wireConverter()}
function homeView(){const s=spent(),budget=num(state.settings.budget),remaining=budget-s,days=state.settings.tripDate?Math.ceil((new Date(state.settings.tripDate+'T00:00:00').getTime()-Date.now())/86400000):null;return `<section class="card hero"><p class="muted">Total trip budget</p><strong>${money(budget)}</strong><p>${money(s)} spent · ${money(remaining)} remaining</p><div class="progress"><div style="width:${budget?Math.min(100,Math.max(0,s/budget*100)):0}%"></div></div></section>${remaining<0?'<p class="notice">⚠️ You have exceeded your trip budget.</p>':''}<div class="grid"><div class="card"><p class="muted">Shopping list</p><h2>${state.items.length} items</h2><p class="muted">Planned: ${money(wishlistTotal(state.items))}</p><p class="muted">${state.items.filter(x=>x.status==='Purchased').length} purchased</p></div><div class="card"><p class="muted">Receipts & expenses</p><h2>${state.expenses.length}</h2><p class="muted">Actual spending only</p></div><div class="card"><p class="muted">Trip countdown</p><h2>${days===null?'Not set':days>0?days+' days':days===0?'Today!':'Trip started'}</h2><p class="muted">${esc(state.settings.tripDate||'Set departure in Settings')}</p></div></div><section class="card"><h2>Quick actions</h2><div class="row">${button('add','item','+ Shopping item')}${button('add','expense','+ Expense')}${button('add','preparation','+ To prepare')}${button('add','place','+ Place / activity')}</div></section><section class="card"><h2>Latest expenses</h2>${state.expenses.slice(-4).reverse().map(x=>`<div class="item"><div class="grow"><strong>${esc(x.store)}</strong><div class="muted">${esc(x.date)} · ${esc(x.category)}</div></div><strong>${money(x.amount,x.currency)}</strong></div>`).join('')||'<div class="empty">No expenses yet</div>'}</section>`}
function shopView(){let q=esc($('searchCache')?.value||'');const filtered=state.items.filter(x=>{let text=[x.name,storeName(x.storeId),categoryName(x.categoryId),x.notes].join(' ').toLowerCase();return !q||text.includes(q.toLowerCase())});return `<div class="row between"><h2>Shopping planner</h2>${button('add','store','+ Store')}</div><div class="toolbar">${button('add','category','+ Category')}${button('add','item','+ Item')}</div><div class="card"><label>Search items<input id="shopSearch" type="search" placeholder="Search store, category, item..." value="${q}"></label><div class="two" style="margin-top:10px"><label>Status<select id="statusFilter"><option value="">All statuses</option><option>Wishlist</option><option>Purchased</option><option>Skipped</option></select></label><label>Sort<select id="sortFilter"><option value="name">Name</option><option value="price">Price</option><option value="status">Status</option></select></label></div></div>${totalDisplay(wishlistTotal(state.items),'Overall wishlist total')}${!state.rate&&state.items.some(x=>x.currency==='JPY')?'<p class="muted">JPY items need an exchange rate for accurate RM totals.</p>':''}<div id="shopResults">${shopResults(filtered)}</div>`}
function shopResults(items){return state.stores.map(store=>{const si=items.filter(x=>x.storeId===store.id),all=state.items.filter(x=>x.storeId===store.id),planned=wishlistTotal(all),limit=num(store.budget);return `<section class="card"><div class="row between"><h2>${esc(store.name)}</h2><div class="row">${button('edit','store:'+store.id,'Edit')}${button('delete','store:'+store.id,'Delete','danger')}</div></div><p class="muted">${all.length} items · Budget ${limit?money(limit):'not set'}</p>${totalDisplay(planned,'Store wishlist total')}${limit&&planned>limit?'<p class="notice">⚠️ Store plan exceeds budget</p>':''}${state.categories.filter(c=>c.storeId===store.id).map(c=>{const categoryItems=si.filter(x=>x.categoryId===c.id),categoryAll=all.filter(x=>x.categoryId===c.id),done=categoryAll.filter(x=>x.status==='Purchased').length;return `<details class="category-panel" data-category="${esc(c.id)}" ${openCategories.has(c.id)?'open':''}><summary><span class="category-label"><strong>📂 ${esc(c.name)}</strong><small>${done}/${categoryAll.length} purchased · ${money(wishlistTotal(categoryAll))}</small></span><span class="category-chevron">⌄</span></summary><div class="category-content"><div class="row between"><span class="muted">Tap an item to update its details</span><div class="row">${button('edit','category:'+c.id,'Edit')}${button('delete','category:'+c.id,'Delete','danger')}</div></div>${categoryItems.map(itemRow).join('')||'<p class="muted">No matching items</p>'}</div></details>`}).join('')}${si.filter(x=>!state.categories.some(c=>c.id===x.categoryId&&c.storeId===store.id)).map(itemRow).join('')}</section>`}).join('')||'<div class="card empty">Start by adding a store, then categories and items.</div>'}
function itemRow(x){const purchased=x.status==='Purchased';return `<div class="item wishlist-row">${photoThumb(x,'image','item')}<div class="grow truncate"><button type="button" class="item-name" data-action="edit" data-id="item:${esc(x.id)}">${esc(x.name)}</button><div class="muted">${money(x.price,x.currency)} × ${num(x.qty||1)}</div><div class="amount-emphasis">${money(num(x.price)*num(x.qty||1),x.currency)}${x.currency==='JPY'&&state.rate?' ≈ '+money(calcRM(num(x.price)*num(x.qty||1),x.currency)):''}</div><label class="purchase-toggle"><input type="checkbox" data-purchase="${esc(x.id)}" ${purchased?'checked':''}><span>${purchased?'✓ Purchased':'Mark purchased'}</span></label>${x.status==='Skipped'?'<span class="muted">Skipped</span>':''}</div><div class="stack">${button('edit','item:'+x.id,'Edit')}${button('delete','item:'+x.id,'Delete','danger')}</div></div>`}
function convertView(){return `<section class="card"><h2>Instant currency converter</h2><p class="muted" id="rateLabel">${esc(rateStatus)}</p><div class="stack"><label>From currency<select id="fromCurrency"><option value="JPY">Japanese Yen (JPY)</option><option value="MYR">Malaysian Ringgit (MYR)</option></select></label><label>Amount<input id="fromAmount" type="number" min="0" step="any" inputmode="decimal" value="1000"></label><div class="row">${button('swap','currency','⇅ Swap currencies')}${button('refresh','rate','↻ Refresh rate')}</div><div class="card" style="background:var(--bg)"><p class="muted">Converted amount</p><h1 id="converted">—</h1></div></div><p class="muted">Reference exchange rates only. Your card or cash provider may charge different rates or fees. Last saved rate is available offline.</p></section>`}
function expenseView(){return `<div class="row between"><h2>Expense journal</h2>${button('add','expense','+ Expense')}</div><section class="card hero"><p class="muted">Actual recorded spending</p><strong>${money(spent())}</strong><p class="muted">JPY expenses require a saved conversion rate for RM totals.</p></section><div class="card"><label>Search expenses<input id="expenseSearch" placeholder="Merchant, category, notes..." type="search"></label><div id="expenseResults">${expenseRows(state.expenses)}</div></div>`}

function readyView(){

function fieldHtml([key,label,type],obj){const v=obj?.[key]??(key==='qty'?1:key==='currency'?'JPY':key==='status'?(type==='prepstatus'?'To do':'Wishlist'):key==='method'?'Wise':key==='date'?today():'');let control='';if(type==='store')control=`<select name="${key}" required><option value="">Choose store</option>${state.stores.map(s=>`<option value="${esc(s.id)}" ${s.id===v?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;else if(type==='category')control=`<select name="${key}"><option value="">Uncategorized</option>${state.categories.filter(c=>!obj?.storeId||c.storeId===obj.storeId).map(c=>`<option value="${esc(c.id)}" ${c.id===v?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;else if(type==='item')control=`<select name="${key}"><option value="">No linked item</option>${state.items.map(i=>`<option value="${esc(i.id)}" ${i.id===v?'selected':''}>${esc(i.name)} (${esc(storeName(i.storeId))})</option>`).join('')}</select>`;else if(type==='currency'||type==='status'||type==='method'){let options=type==='currency'?['JPY','MYR']:type==='status'?['Wishlist','Purchased','Skipped']:['Cash JPY','Cash MYR','Wise','Card','Other'];control=`<select name="${key}">${options.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`}else if(type==='placetype')control=`<select name="${key}">${['Attraction','Ride / activity','Shopping','Food / café','Rental','Transport','Accommodation','Other'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;else if(type==='placestatus')control=`<select name="${key}">${['Wishlist','Planned','Booked','Visited','Skipped'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;else if(type==='dateoptional')control=`<input name="${key}" type="date" value="${esc(v)}">`;else if(type==='coordinate')control=`<input name="${key}" type="number" step="any" placeholder="Optional" value="${esc(v)}">`;else if(type==='prepstatus')control=`<select name="${key}">${['To do','Booked','Paid','Ready'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;else if(type==='textarea')control=`<textarea name="${key}">${esc(v)}</textarea>`;else if(type==='image')control=`<input name="${key}" type="file" accept="image/jpeg,image/png,image/webp" multiple><span class="muted">Choose from Photo Library or take a photo · multiple images · 5 MB each</span>${v?'<span class="muted">Current photo kept unless replaced</span>':''}`;else if(type==='check')control=`<input name="${key}" type="checkbox" style="width:25px" ${v?'checked':''}>`;else control=`<input name="${key}" type="${type}" value="${esc(v)}" ${type==='number'?'min="0" step="any" inputmode="decimal"':''} ${['name','amount','price','title','budget'].includes(key)?'required':''} ${key==='date'?'required':''}>`;return `<label>${esc(label)}${control}</label>`}
function openModal(kind,id=null){modalKind=kind;editing=id;const collection=kind==='place'?'places':kind==='preparation'?'preparations':kind==='note'?'notes':kind==='category'?'categories':kind==='store'?'stores':kind==='item'?'items':kind==='expense'?'expenses':kind==='packing'?'packing':null;const obj=kind==='settings'?state.settings:collection?state[collection].find(x=>x.id===id):null;$('modalTitle').textContent=(id?'Edit ':'Add ')+kind;$('fields').innerHTML=fields[kind].map(f=>fieldHtml(f,obj)).join('');$('modal').showModal();if(kind==='item'){$('fields').querySelector('[name=storeId]').addEventListener('change',e=>{const select=$('fields').querySelector('[name=categoryId]');select.innerHTML='<option value="">Uncategorized</option>'+state.categories.filter(c=>c.storeId===e.target.value).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')})}}
async function photo(file){if(!file)return null;if(file.size>MAX_FILE)throw Error('Image must be 5 MB or less');const bytes=new Uint8Array(await file.arrayBuffer());let mime='';if(bytes[0]===0xff&&bytes[1]===0xd8&&bytes[2]===0xff)mime='image/jpeg';else if(bytes[0]===0x89&&bytes[1]===0x50&&bytes[2]===0x4e&&bytes[3]===0x47)mime='image/png';else if(bytes.length>12&&String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')mime='image/webp';if(!mime)throw Error('Unsupported image content');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read image'));r.readAsDataURL(new Blob([bytes],{type:mime}))})}
async function submitForm(e){e.preventDefault();const btn=$('submit');btn.disabled=true;try{const form=e.target,obj=modalKind==='settings'?{...state.settings}:editing?{...state[modalKind==='place'?'places':modalKind==='preparation'?'preparations':modalKind==='note'?'notes':modalKind==='category'?'categories':modalKind==='store'?'stores':modalKind==='item'?'items':modalKind==='expense'?'expenses':'packing'].find(x=>x.id===editing)}:{id:uid()};for(const [key,,type] of fields[modalKind]){const el=form.elements.namedItem(key);if(type==='image'){if(el.files.length){if(el.files.length>12||pictures(obj,key).length+el.files.length>12)throw Error('Maximum 12 photos per entry');const added=[];for(const file of el.files)added.push(await photo(file));obj[key+'s']=[...pictures(obj,key),...added];delete obj[key]}}else if(type==='check')obj[key]=el.checked;else if(type==='number'){if(!Number.isFinite(Number(el.value))||Number(el.value)<0)throw Error('Invalid '+key);obj[key]=Number(el.value)}else obj[key]=el.value.trim()}if(modalKind==='place'){if(!obj.name||obj.name.length>180||!['JPY','MYR'].includes(obj.currency))throw Error('Enter a valid place name and currency');for(const [k,max] of [['latitude',90],['longitude',180]]){if(obj[k]!==''&&(!Number.isFinite(Number(obj[k]))||Math.abs(Number(obj[k]))>max))throw Error('Invalid '+k)}}if(modalKind==='preparation'){if(!obj.name||!['JPY','MYR'].includes(obj.currency)||!['To do','Booked','Paid','Ready'].includes(obj.status))throw Error('Invalid preparation item')}if(modalKind==='item'){if(!state.stores.some(s=>s.id===obj.storeId))throw Error('Select a valid store');if(obj.categoryId&&!state.categories.some(c=>c.id===obj.categoryId&&c.storeId===obj.storeId))throw Error('Category does not belong to selected store');if(!Number.isInteger(obj.qty)||obj.qty<1||obj.qty>9999)throw Error('Quantity must be 1–9999')}if(modalKind==='category'&&!state.stores.some(s=>s.id===obj.storeId))throw Error('Select a store');if(modalKind==='expense'){if(obj.itemId&&!state.items.some(i=>i.id===obj.itemId))throw Error('Linked item no longer exists');if(obj.itemId){const item=state.items.find(i=>i.id===obj.itemId);item.status='Purchased'}}if(modalKind==='settings')state.settings=obj;else{const key=modalKind==='place'?'places':modalKind==='preparation'?'preparations':modalKind==='note'?'notes':modalKind==='category'?'categories':modalKind==='store'?'stores':modalKind==='item'?'items':modalKind==='expense'?'expenses':'packing';if(editing)state[key]=state[key].map(x=>x.id===editing?obj:x);else state[key].push(obj)}await save();$('modal').close();render()}catch(err){alert('Could not save: '+err.message)}finally{btn.disabled=false}}
async function fetchRate(){rateStatus='Updating exchange rate...';if(view==='convert')render();try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);let data;try{const r=await fetch('https://latest.currency-api.pages.dev/v1/currencies/jpy.json',{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('Exchange service unavailable');data=await r.json()}finally{clearTimeout(timer)}const value=Number(data?.jpy?.myr);if(!(value>0&&value<1))throw Error('Invalid exchange rate');state.rate={value,date:String(data.date||today()).slice(0,10)};await save();rateStatus='Online reference rate · '+state.rate.date}catch(e){rateStatus=state.rate?'Offline saved rate · '+state.rate.date:'No exchange rate available · connect to internet'}if(view==='convert')render()}

async function restore(file){if(!file||file.size>MAX_BACKUP)throw Error('Backup exceeds 35 MB');const raw=JSON.parse(await file.text());if(raw.app!=='Trip List 3.0'||raw.version!==1)throw Error('Unsupported backup format');const restored=normalize(raw.data);if(!confirm('Replace ALL existing local data with this backup? This cannot be undone.'))return;const old=state;state=restored;try{await save()}catch(e){state=old;throw e}document.body.className=state.settings.theme==='lavender'?'':state.settings.theme;render();alert('Backup restored successfully')}
async function remove(kind,id){const key={place:'places',preparation:'preparations',store:'stores',category:'categories',item:'items',expense:'expenses',packing:'packing',note:'notes'}[kind];if(!key)return;const dependencies=kind==='store'?(state.categories.some(x=>x.storeId===id)||state.items.some(x=>x.storeId===id)):kind==='category'?state.items.some(x=>x.categoryId===id):false;if(dependencies){alert('Remove related categories/items first.');return}if(!confirm('Delete this '+kind+'?'))return;state[key]=state[key].filter(x=>x.id!==id);await save();render()}

function delegate(e){const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;render();return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action,id=a.dataset.id;const [kind,recordId]=id.split(':');if(action==='add')openModal(id);else if(action==='edit')openModal(kind,recordId);else if(action==='delete')remove(kind,recordId).catch(err=>alert(err.message));else if(action==='gallery')showGallery(kind,recordId);else if(action==='backup')backup();else if(action==='restore')$('restoreInput').click();else if(action==='theme')changeTheme();else if(action==='refresh')fetchRate();else if(action==='swap'){const select=$('fromCurrency');select.value=select.value==='JPY'?'MYR':'JPY';select.dispatchEvent(new Event('change'))}else if(action==='receipt'){const rec=state.expenses.find(x=>x.id===id);if(rec?.receipt&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(rec.receipt)){const w=window.open("","_blank","noopener");if(w){const img=w.document.createElement("img");img.alt="Receipt";img.style.maxWidth="100%";img.src=rec.receipt;w.document.body.append(img)}else alert("Please allow pop-ups to view receipt")}}}
function attach(){document.addEventListener('click',delegate);$('galleryClose').onclick=()=>$('gallery').close();$('galleryPrev').onclick=()=>moveGallery(-1);$('galleryNext').onclick=()=>moveGallery(1);let touchX=null;$('galleryStage').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});$('galleryStage').addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)moveGallery(dx<0?1:-1);touchX=null},{passive:true});$('quick').onclick=()=>{const choices=[['item','🛍 Shopping item'],['place','📍 Place / experience'],['expense','🧾 Expense / receipt'],['preparation','✈ Preparation'],['store','🏬 Store'],['category','📂 Category'],['packing','🧳 Packing'],['note','📝 Note']];$('quickChoices').innerHTML=choices.map(([kind,label])=>`<button type="button" class="secondary" data-quick="${kind}">${label}</button>`).join('');$('quickMenu').showModal()};$('quickClose').onclick=()=>$('quickMenu').close();$('quickChoices').onclick=e=>{const b=e.target.closest('[data-quick]');if(!b)return;$('quickMenu').close();openModal(b.dataset.quick)};$('themeButton').onclick=changeTheme;$('cancel').onclick=()=>$('modal').close();$('entryForm').onsubmit=submitForm;$('restoreInput').onchange=async e=>{try{await restore(e.target.files[0])}catch(err){alert('Restore failed: '+err.message)}finally{e.target.value=''}};document.addEventListener('toggle',e=>{const d=e.target;if(d.matches?.('details[data-category]')){if(d.open)openCategories.add(d.dataset.category);else openCategories.delete(d.dataset.category)}},true);document.addEventListener('change',async e=>{if(e.target.dataset.purchase){const item=state.items.find(x=>x.id===e.target.dataset.purchase);if(!item)return;const previous=item.status;item.status=e.target.checked?'Purchased':'Wishlist';e.target.disabled=true;try{await save();render()}catch(err){item.status=previous;e.target.disabled=false;e.target.checked=previous==='Purchased';alert('Could not update item: '+err.message)}return}if(e.target.dataset.pack){const p=state.packing.find(x=>x.id===e.target.dataset.pack);if(p){p.packed=e.target.checked;try{await save();render()}catch(err){alert(err.message)}}}});document.addEventListener('input',e=>{if(e.target.id==='shopSearch'){window.searchText=e.target.value;filterShop()}if(e.target.id==='expenseSearch'){let q=e.target.value.toLowerCase();$('expenseResults').innerHTML=expenseRows(state.expenses.filter(x=>[x.store,x.category,x.notes].join(' ').toLowerCase().includes(q)))}});document.addEventListener('change',e=>{if(['statusFilter','sortFilter'].includes(e.target.id))filterShop()})}
function filterShop(){const q=($('shopSearch')?.value||'').toLowerCase(),status=$('statusFilter')?.value,sort=$('sortFilter')?.value;let items=state.items.filter(x=>[x.name,storeName(x.storeId),categoryName(x.categoryId),x.notes].join(' ').toLowerCase().includes(q)&&(!status||x.status===status));items.sort((a,b)=>sort==='price'?num(a.price)-num(b.price):String(sort==='status'?a.status:a.name).localeCompare(String(sort==='status'?b.status:b.name)));$('shopResults').innerHTML=shopResults(items)}
(async()=>{try{db=await openDb();const existing=await readDb();if(existing){state=normalize(existing)}else await save();document.body.className=state.settings.theme==='lavender'?'':state.settings.theme;attach();render();if(navigator.onLine)fetchRate();else if(state.rate){rateStatus='Offline saved rate · '+state.rate.date}if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('view').innerHTML='<section class="card"><h2>Storage unavailable</h2><p>Open this website in normal Safari or Chrome (not private browsing). Your browser must support IndexedDB.</p><p class="muted">'+esc(e.message)+'</p></section>'; $('quick').disabled=true}})();
</script></body></html>
