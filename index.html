<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6ff"><title>Trip List · Travel companion</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#26223d;background:#f8f6ff;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #c9b9ff;outline-offset:2px}button{border:0}.shell{max-width:1140px;margin:auto;padding:28px 22px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:21px;letter-spacing:-.7px}.logo{display:grid;place-items:center;width:43px;height:43px;background:#6d50d9;color:white;border-radius:15px;font-size:22px;box-shadow:0 7px 16px #7056cb35}.sub{font-size:12px;color:#827b9b;font-weight:500;margin-top:3px}.actions,.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #e5dff3;background:white;border-radius:12px;padding:11px 14px;color:#40375b;font-weight:700;display:inline-flex;gap:7px;align-items:center;justify-content:center}.btn.primary{background:#6d50d9;color:#fff;border-color:#6d50d9}.btn.soft{background:#f0ebff;color:#6244c8;border-color:#f0ebff}.btn.danger{color:#b33b60}.btn.small{padding:7px 10px;border-radius:9px;font-size:12px}.hero{background:linear-gradient(115deg,#6b4bd6,#9b7be9);color:white;border-radius:25px;padding:27px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden;position:relative}.hero:after{content:'✦';position:absolute;right:24%;top:-50px;font-size:190px;color:#ffffff13;pointer-events:none}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase;opacity:.8}.hero h1{font-size:30px;line-height:1.16;letter-spacing:-1px;margin:9px 0}.hero p{margin:0;opacity:.83}.hero-stat{text-align:right;z-index:1;min-width:170px}.hero-stat strong{font-size:29px;display:block}.hero-stat small{opacity:.85}.tabs{display:flex;gap:8px;margin:22px 0;overflow:auto;padding:3px 0}.tab{white-space:nowrap;padding:12px 18px;border-radius:13px;background:transparent;color:#77708e;font-weight:750}.tab.active{background:#fff;color:#6246cc;box-shadow:0 3px 14px #30235d0c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.panel{background:white;border:1px solid #eeeaf5;border-radius:19px;padding:20px;box-shadow:0 5px 24px #40316506}.metric-label{color:#827b98;font-size:12px;font-weight:700}.metric-value{font-size:25px;font-weight:850;margin:8px 0 3px;letter-spacing:-.7px}.metric-note{font-size:12px;color:#968eab}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 13px}.sectionhead h2{margin:0;font-size:20px;letter-spacing:-.5px}.muted{color:#89829e}.stores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.store{background:#fff;border:1px solid #ebe6f5;border-radius:19px;padding:20px}.store-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.store-name{font-size:18px;font-weight:850}.pill{border-radius:30px;background:#f3efff;color:#6a4fc5;padding:5px 9px;font-size:11px;font-weight:800}.progress{height:7px;border-radius:20px;background:#eeeaf7;overflow:hidden;margin:15px 0 10px}.progress>div{height:100%;background:#9478e7;border-radius:20px}.category{margin-top:15px;border-top:1px solid #f1eef7;padding-top:14px}.cat-title{font-weight:800;font-size:13px;margin-bottom:9px;display:flex;justify-content:space-between}.item{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid #f5f2f9}.item:last-child{border:0}.thumb{width:54px;height:54px;border-radius:12px;background:#f2eeff;object-fit:cover;flex-shrink:0;display:grid;place-items:center;color:#9d87e4;font-size:22px}.item-main{flex:1;min-width:0}.item-name{font-weight:750;overflow-wrap:anywhere}.item-meta{font-size:12px;color:#89829c;margin-top:4px}.item-buttons{display:flex;gap:4px}.iconbtn{background:#f7f5fc;border-radius:9px;padding:8px;color:#665b83}.tag{font-size:10px;padding:3px 7px;border-radius:6px;background:#f5f3fa;color:#817a94;font-weight:750}.tag.bought{background:#e7f7ee;color:#24855a}.empty{border:1px dashed #dcd4ef;border-radius:17px;padding:35px;text-align:center;color:#817994;background:white}.empty b{display:block;color:#42375e;font-size:16px;margin-bottom:5px}.converter{display:grid;grid-template-columns:1.1fr .9fr;gap:17px}.rate-box{padding:25px;background:#fff;border:1px solid #ebe6f5;border-radius:20px}.currency-row{background:#f8f6fd;padding:15px;border-radius:14px;margin-top:12px}.currency-row label{display:block;font-size:12px;color:#827a99;font-weight:800;margin-bottom:7px}.currency-input{display:flex;align-items:center;gap:10px}.currency-input input{width:100%;border:0;background:transparent;font-size:27px;font-weight:850;outline:none;min-width:0;color:#2c2443}.currency-code{font-weight:850;color:#6d50d9}.rate-status{margin-top:14px;font-size:12px;color:#77708b;line-height:1.6}.receipt-list{display:grid;gap:11px}.receipt{display:flex;align-items:center;gap:14px;background:white;border:1px solid #ece8f4;border-radius:15px;padding:13px}.receipt .thumb{width:60px;height:60px}.receipt-info{flex:1;min-width:0}.receipt-title{font-weight:850;font-size:15px}.receipt-detail{font-size:12px;color:#88819a;margin-top:5px}.receipt-price{text-align:right;font-weight:850;font-size:17px}.receipt-price small{display:block;font-weight:500;font-size:12px;color:#918aa5;margin-top:4px}.filters{display:flex;gap:9px;flex-wrap:wrap}.filters input,.filters select{padding:10px;border:1px solid #e8e2f1;border-radius:10px;background:white;max-width:100%}.overlay{position:fixed;inset:0;background:#1c143c88;z-index:10;display:flex;align-items:center;justify-content:center;padding:15px;overflow:auto}.dialog{background:white;width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:24px;box-shadow:0 25px 70px #1d143b45}.dialog h2{margin:0 0 17px;font-size:21px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#665b7c}.field input,.field select,.field textarea{border:1px solid #e3dded;border-radius:11px;padding:11px;width:100%;background:white;color:#2b2341}.field textarea{resize:vertical}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.preview{width:90px;height:90px;object-fit:cover;border-radius:12px;margin-top:8px}.notice{font-size:12px;color:#837a9b;line-height:1.5}.footer{text-align:center;margin-top:28px;font-size:12px;color:#968da9}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c234b;color:white;border-radius:12px;padding:12px 17px;z-index:30;box-shadow:0 10px 30px #0002;max-width:90vw}.settings{display:grid;gap:12px}.line{display:flex;justify-content:space-between;gap:10px;align-items:center}.category-name{color:#7b6e9b;font-size:12px}.receipt-link{font-size:12px;color:#6c4bcf;font-weight:800;cursor:pointer;background:transparent;padding:5px}.helper{background:#f7f3ff;border-radius:14px;padding:13px;color:#716388;font-size:12px;line-height:1.6}@media(max-width:760px){.shell{padding:17px 14px 100px}.hero{padding:22px}.hero h1{font-size:24px}.hero-stat strong{font-size:22px}.grid{grid-template-columns:1fr 1fr}.grid .card:last-child{grid-column:1/-1}.stores,.converter{grid-template-columns:1fr}.top{margin-bottom:18px}.brand{font-size:18px}.top .actions .btn{font-size:12px;padding:9px}.sectionhead{align-items:flex-start}.receipt-price{font-size:14px}.receipt{gap:9px}.receipt .thumb{width:47px;height:47px}}@media(max-width:420px){.hero-stat{min-width:95px}.hero-stat strong{font-size:19px}.hero h1{font-size:22px}.fields{grid-template-columns:1fr}.grid{gap:8px}.card{padding:14px}.metric-value{font-size:21px}.tab{padding:11px 12px}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="logo">✈</span><div>Trip List<div class="sub">Your little travel companion</div></div></div><div class="actions"><button class="btn small" id="backupBtn">⇩ Backup</button><button class="btn small" id="settingsBtn">⚙ Settings</button></div></header><section class="hero"><div><div class="eyebrow">Your travel dashboard ✨</div><h1>Plan cute. Spend smart.</h1><p>Everything for your next adventure, in one place.</p></div><div class="hero-stat"><small>Trip budget</small><strong id="heroBudget">RM 0</strong><small id="heroRemaining">Set your budget ✨</small></div></section><nav class="tabs" aria-label="Pages"><button class="tab active" data-tab="planner">🛍 Shopping Planner</button><button class="tab" data-tab="converter">💱 Converter</button><button class="tab" data-tab="expenses">🧾 Expenses</button></nav><main id="content"></main><footer class="footer">Made for little adventures ♡ · Data stored on this device · Back up regularly</footer></div><div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
const DB_NAME='trip-list-v2', DB_VERSION=1, MAX_IMAGE=6*1024*1024;
let db, state={stores:[],items:[],expenses:[],settings:{budget:0,rate:null,rateDate:null,rateFetched:null},tab:'planner'};
const $=s=>document.querySelector(s), money=(n,c='MYR')=>new Intl.NumberFormat('en-MY',{style:'currency',currency:c,maximumFractionDigits:c==='JPY'?0:2}).format(Number(n)||0),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID(),yenToRm=n=>state.settings.rate==null?null:Number(n)*state.settings.rate,rmToYen=n=>state.settings.rate==null?null:Number(n)/state.settings.rate,rmValue=(amount,currency)=>currency==='JPY'?yenToRm(amount):Number(amount),displayRM=n=>n==null?'Rate unavailable':money(n),storeById=x=>state.stores.find(s=>s.id===x),today=()=>new Date().toLocaleDateString('en-CA');
function request(store,mode,fn){return new Promise((resolve,reject)=>{const tx=db.transaction(store,mode),os=tx.objectStore(store);let result;tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);try{const req=fn(os);if(req)req.onsuccess=()=>{result=req.result};}catch(e){tx.abort();reject(e)}})}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;for(const s of ['stores','items','expenses','settings'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function refresh(){for(const key of ['stores','items','expenses'])state[key]=await request(key,'readonly',s=>s.getAll());const saved=await request('settings','readonly',s=>s.get('main'));if(saved)state.settings={...state.settings,...saved};render()}
async function put(store,value){await request(store,'readwrite',s=>s.put(value));await refresh()}
async function del(store,key){await request(store,'readwrite',s=>s.delete(key));await refresh()}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hidden'),3500)}
function safeNum(v,max=1e9){const n=Number(v);if(!Number.isFinite(n)||n<0||n>max)throw Error('Enter a valid non-negative amount.');return n}
function inputVal(f,k){return f.elements.namedItem(k)?.value?.trim()??''}
function metrics(){const spent=state.expenses.reduce((s,x)=>s+(rmValue(x.amount,x.currency)??0),0),planned=state.items.filter(x=>!x.bought).reduce((s,x)=>s+(rmValue(x.price*x.qty,x.currency)??0),0);return {spent,planned,remaining:state.settings.budget-spent}}
function render(){const m=metrics();$('#heroBudget').textContent=money(state.settings.budget);$('#heroRemaining').textContent=state.settings.rate==null?'Set exchange rate when online':`${money(m.remaining)} remaining`;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));$('#content').innerHTML=state.tab==='planner'?planner():state.tab==='converter'?converter():expensesPage()}
function stats(){const m=metrics();return `<div class="grid"><div class="card"><div class="metric-label">🛍 Still on wishlist</div><div class="metric-value">${displayRM(m.planned)}</div><div class="metric-note">Unpurchased shopping items</div></div><div class="card"><div class="metric-label">🧾 Actual spending</div><div class="metric-value">${displayRM(m.spent)}</div><div class="metric-note">From your expense journal</div></div><div class="card"><div class="metric-label">💜 Budget left</div><div class="metric-value">${displayRM(m.remaining)}</div><div class="metric-note">Actual spending only</div></div></div>`}
function planner(){return `${stats()}<div class="sectionhead"><div><h2>My shopping places</h2><div class="muted">Organize by store → category → item</div></div><button class="btn primary" data-action="store">+ Add store</button></div>${state.stores.length?`<div class="stores">${state.stores.map(storeCard).join('')}</div>`:`<div class="empty"><b>Your shopping adventure starts here ✨</b>Add GU, Donki, Uniqlo, or any store you like.<p><button class="btn primary" data-action="store">+ Create first store</button></p></div>`}`}
function storeCard(s){const items=state.items.filter(x=>x.storeId===s.id),cats=[...new Set(items.map(x=>x.category))].sort(),used=items.filter(x=>x.bought).reduce((a,x)=>a+(rmValue(x.price*x.qty,x.currency)??0),0),planned=items.reduce((a,x)=>a+(rmValue(x.price*x.qty,x.currency)??0),0),pct=s.budget>0?Math.min(100,Math.round(planned/s.budget*100)):0;return `<article class="store"><div class="store-title"><div><div class="store-name">${esc(s.name)}</div><div class="muted" style="font-size:12px;margin-top:4px">${items.length} items · ${items.filter(x=>x.bought).length} bought</div></div><div class="actions"><button class="iconbtn" data-action="editstore" data-id="${esc(s.id)}" title="Edit store">✎</button><button class="iconbtn" data-action="deletestore" data-id="${esc(s.id)}" title="Delete store">×</button></div></div><div class="progress"><div style="width:${pct}%"></div></div><div class="line"><span class="muted" style="font-size:12px">Planned ${displayRM(planned)}</span><span class="pill">Budget ${money(s.budget)}</span></div><div class="muted" style="font-size:12px;margin-top:6px">Marked bought: ${displayRM(used)} (not added to expenses)</div>${cats.map(c=>`<div class="category"><div class="cat-title"><span>✦ ${esc(c)}</span><span class="muted">${items.filter(x=>x.category===c).length} items</span></div>${items.filter(x=>x.category===c).map(itemRow).join('')}</div>`).join('')}<button class="btn soft" style="width:100%;margin-top:15px" data-action="item" data-store="${esc(s.id)}">+ Add item / category</button></article>`}
function itemRow(x){return `<div class="item">${x.image?`<img class="thumb" alt="" src="${URL.createObjectURL(x.image)}">`:`<div class="thumb">🛍</div>`}<div class="item-main"><div class="item-name">${esc(x.name)} <span class="tag ${x.bought?'bought':''}">${x.bought?'Bought':'Wishlist'}</span></div><div class="item-meta">${money(x.price,x.currency)} × ${x.qty} · ${displayRM(rmValue(x.price*x.qty,x.currency))}</div></div><div class="item-buttons"><button class="iconbtn" data-action="toggle" data-id="${esc(x.id)}" title="Toggle purchased">${x.bought?'↶':'✓'}</button><button class="iconbtn" data-action="edititem" data-id="${esc(x.id)}" title="Edit">✎</button><button class="iconbtn" data-action="deleteitem" data-id="${esc(x.id)}" title="Delete">×</button></div></div>`}
function converter(){const r=state.settings.rate;return `<div class="sectionhead"><div><h2>Currency converter</h2><div class="muted">Live JPY ↔ MYR, with saved offline rate</div></div><button class="btn soft" data-action="rate">↻ Refresh rate</button></div><div class="converter"><section class="rate-box"><div class="eyebrow" style="color:#7459d0">Instant conversion</div><div class="currency-row"><label for="yenInput">Japanese Yen</label><div class="currency-input"><input id="yenInput" type="number" min="0" step="any" value="1000" inputmode="decimal"><span class="currency-code">JPY ¥</span></div></div><div style="text-align:center;font-size:23px;margin:8px">⇅</div><div class="currency-row"><label for="rmInput">Malaysian Ringgit</label><div class="currency-input"><input id="rmInput" type="number" min="0" step="any" value="${r==null?'':(1000*r).toFixed(2)}" inputmode="decimal"><span class="currency-code">MYR RM</span></div></div><div class="rate-status" id="rateInfo">${r==null?'No rate yet. Connect to the internet and tap Refresh rate.':`1 JPY ≈ ${money(r)} · Rate date: ${esc(state.settings.rateDate||'Unknown')}<br>Last fetched: ${esc(state.settings.rateFetched?new Date(state.settings.rateFetched).toLocaleString():'Unknown')} · Indicative rate, not a bank rate.`}</div></section><section class="panel"><h2 style="margin-top:0">✨ Quick reference</h2>${[500,1000,2000,3000,5000,10000,20000].map(n=>`<div class="line" style="padding:11px 0;border-bottom:1px solid #f1eef6"><strong>${money(n,'JPY')}</strong><span>${displayRM(yenToRm(n))}</span></div>`).join('')}<p class="notice">Rates require internet to refresh. Your bank or card may apply different rates and fees. Last saved rate remains usable offline.</p></section></div>`}
function expensesPage(){const sum=state.expenses.reduce((s,x)=>s+(rmValue(x.amount,x.currency)??0),0);return `${stats()}<div class="sectionhead"><div><h2>Expense journal</h2><div class="muted">Your real purchases, receipts & payments</div></div><button class="btn primary" data-action="expense">+ Add expense</button></div><div class="filters"><input id="searchExpense" placeholder="Search store or note…" aria-label="Search expenses"><select id="filterExpense" aria-label="Filter category"><option value="">All categories</option>${[...new Set(state.expenses.map(x=>x.category))].sort().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div><div id="expenseResults" style="margin-top:15px">${expenseRows(state.expenses)}</div><div class="helper" style="margin-top:15px">Shopping items marked “Bought” do not automatically become expenses. Add the actual amount here once you pay, so your spending is never counted twice.</div>`}
function expenseRows(list){return list.length?`<div class="receipt-list">${[...list].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<article class="receipt">${x.receipt?`<img class="thumb" alt="Receipt preview" src="${URL.createObjectURL(x.receipt)}">`:`<div class="thumb">🧾</div>`}<div class="receipt-info"><div class="receipt-title">${esc(x.store)}</div><div class="receipt-detail">${esc(x.date)} · ${esc(x.category)} · ${esc(x.method)}</div>${x.note?`<div class="receipt-detail">${esc(x.note)}</div>`:''}${x.receipt?`<button class="receipt-link" data-action="viewreceipt" data-id="${esc(x.id)}">View receipt ↗</button>`:''}</div><div><div class="receipt-price">${money(x.amount,x.currency)}<small>${displayRM(rmValue(x.amount,x.currency))}</small></div><div class="actions" style="justify-content:flex-end;margin-top:7px"><button class="iconbtn" data-action="editexpense" data-id="${esc(x.id)}" title="Edit">✎</button><button class="iconbtn" data-action="deleteexpense" data-id="${esc(x.id)}" title="Delete">×</button></div></div></article>`).join('')}</div>`:`<div class="empty"><b>No expenses found 🧾</b>Add your first purchase or change the filters.</div>`}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="f_${name}">${esc(label)}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,opts,selected){return `<div class="field"><label for="f_${name}">${esc(label)}</label><select id="f_${name}" name="${name}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}
function dialog(title,body,submit,onSubmit){$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">${esc(title)}</h2><form id="dialogForm"><div class="fields">${body}</div><div class="dialog-foot"><button class="btn" type="button" id="cancelModal">Cancel</button><button class="btn primary" type="submit">${esc(submit)}</button></div></form></div></div>`;$('#cancelModal').onclick=closeDialog;$('#dialogForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter||$('#dialogForm button[type=submit]');b.disabled=true;try{await onSubmit(e.currentTarget);closeDialog();toast('Saved successfully 💜')}catch(err){toast(err.message||'Could not save. Check available device storage.');b.disabled=false}};$('#dialogForm input, #dialogForm select')?.focus()}
function closeDialog(){$('#modalRoot').innerHTML=''}
function storeDialog(s){dialog(s?'Edit shopping place':'Add shopping place',field('Store name','name',s?.name||'','text','required maxlength="70"')+field('Budget (RM)','budget',s?.budget??0,'number','min="0" max="1000000000" step="0.01" required'),s?'Save store':'Create store',async f=>{const name=inputVal(f,'name');if(!name)throw Error('Store name is required.');await put('stores',{id:s?.id||id(),name,budget:safeNum(inputVal(f,'budget'))})})}
async function imageFromForm(f,name,existing){const file=f.elements.namedItem(name)?.files?.[0];if(!file)return f.elements.namedItem('removeImage')?.checked?null:existing||null;if(file.size>MAX_IMAGE)throw Error('Image must be under 6 MB.');if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type))throw Error('Choose a JPG, PNG, WebP or GIF image.');const bytes=new Uint8Array(await file.slice(0,16).arrayBuffer());const jpg=bytes[0]===255&&bytes[1]===216&&bytes[2]===255,png=bytes.slice(0,8).join(',')==='137,80,78,71,13,10,26,10',gif=String.fromCharCode(...bytes.slice(0,3))==='GIF',webp=String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP';if(!(jpg||png||gif||webp))throw Error('The selected file is not a supported image.');return file}
function photoField(existing,label='Item photo'){return `<div class="field wide"><label>${label}</label><input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif"><span class="notice">Optional · JPG, PNG, WebP or GIF · max 6 MB</span>${existing?'<label><input type="checkbox" name="removeImage"> Remove existing photo</label>':''}</div>`}
function itemDialog(x,storeId){const s=storeById(x?.storeId||storeId)||state.stores[0];if(!s)return toast('Add a store first.');const categories=[...new Set(state.items.filter(i=>i.storeId===s.id).map(i=>i.category))];dialog(x?'Edit item':'Add shopping item',`<div class="field wide"><label>Shopping place</label><input value="${esc(s.name)}" disabled></div>${field('Item name','name',x?.name||'','text','required maxlength="100"')}${field('Category (e.g. Shoes, Skincare)','category',x?.category||categories[0]||'','text','required maxlength="60" list="catSuggestions"')}<datalist id="catSuggestions">${categories.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>${field('Unit price','price',x?.price??'','number','required min="0" max="1000000000" step="0.01"')}${field('Quantity','qty',x?.qty??1,'number','required min="1" max="100000" step="1"')}${selectField('Currency','currency',[['JPY','Japanese Yen (¥)'],['MYR','Malaysian Ringgit (RM)']],x?.currency||'JPY')}${selectField('Status','status',[['wishlist','Wishlist'],['bought','Bought']],x?.bought?'bought':'wishlist')}${photoField(x?.image)}`,x?'Save changes':'Add item',async f=>{const name=inputVal(f,'name'),category=inputVal(f,'category'),qty=safeNum(inputVal(f,'qty'),100000);if(!name||!category||!Number.isInteger(qty)||qty<1)throw Error('Enter a name, category and valid quantity.');const image=await imageFromForm(f,'image',x?.image);await put('items',{id:x?.id||id(),storeId:s.id,name,category,price:safeNum(inputVal(f,'price')),qty,currency:inputVal(f,'currency'),bought:inputVal(f,'status')==='bought',image})})}
function expenseDialog(x){dialog(x?'Edit expense':'Add expense',`${field('Store / merchant','store',x?.store||'','text','required maxlength="100"')}${field('Purchase date','date',x?.date||today(),'date','required')}${field('Amount paid','amount',x?.amount??'','number','required min="0" max="1000000000" step="0.01"')}${selectField('Currency','currency',[['JPY','Japanese Yen (¥)'],['MYR','Malaysian Ringgit (RM)']],x?.currency||'JPY')}${field('Category','category',x?.category||'Shopping','text','required maxlength="60"')}${selectField('Payment method','method',[['Cash','Cash'],['Card','Card'],['E-wallet','E-wallet'],['Other','Other']],x?.method||'Cash')}<div class="field wide"><label>What did you buy? (optional)</label><textarea name="note" rows="3" maxlength="300">${esc(x?.note||'')}</textarea></div>${photoField(x?.receipt,'Receipt photo')}`,x?'Save expense':'Record expense',async f=>{const store=inputVal(f,'store'),date=inputVal(f,'date'),category=inputVal(f,'category');if(!store||!category||!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date+'T00:00:00')))throw Error('Enter valid expense details.');const receipt=await imageFromForm(f,'image',x?.receipt);await put('expenses',{id:x?.id||id(),store,date,category,amount:safeNum(inputVal(f,'amount')),currency:inputVal(f,'currency'),method:inputVal(f,'method'),note:inputVal(f,'note'),receipt})})}
function settingsDialog(){dialog('Trip settings',`${field('Total trip budget (RM)','budget',state.settings.budget,'number','min="0" max="1000000000" step="0.01" required')}<div class="field wide"><div class="helper">Data is stored in this browser using IndexedDB. It does not automatically sync across devices. Use Backup to export your data, including photos and receipts, and Restore to import it on another device.</div></div><div class="field wide"><label>Restore a previous backup</label><input type="file" id="restoreFile" accept="application/json,.json"><button type="button" class="btn small" id="restoreBtn">Restore backup</button></div>`, 'Save settings',async f=>{state.settings.budget=safeNum(inputVal(f,'budget'));await put('settings',{id:'main',...state.settings})});$('#restoreBtn').onclick=async()=>{const file=$('#restoreFile').files[0];if(!file)return toast('Select a backup JSON file.');if(file.size>30*1024*1024)return toast('Backup file exceeds 30 MB.');if(!confirm('Restore replaces ALL current stores, items, expenses and settings. Continue?'))return;try{await restoreBackup(file);closeDialog();toast('Backup restored successfully')}catch(e){toast(e.message)}}}
async function getRate(){const sources=[async()=>{const r=await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.min.json',{cache:'no-store'});if(!r.ok)throw Error('Rate unavailable');const j=await r.json();return {rate:j.jpy?.myr,date:j.date}},async()=>{const r=await fetch('https://open.er-api.com/v6/latest/JPY',{cache:'no-store'});if(!r.ok)throw Error('Rate unavailable');const j=await r.json();if(j.result!=='success')throw Error('Rate unavailable');return {rate:j.rates?.MYR,date:new Date(j.time_last_update_unix*1000).toISOString().slice(0,10)}}];for(const source of sources){try{const data=await source();if(!Number.isFinite(data.rate)||data.rate<=0||data.rate>1)throw Error('Invalid rate');state.settings.rate=data.rate;state.settings.rateDate=data.date;state.settings.rateFetched=new Date().toISOString();await put('settings',{id:'main',...state.settings});toast('Exchange rate updated ✨');return}catch(e){console.warn('Exchange rate source unavailable',e)}}toast('Could not refresh rate. Using last saved rate if available.')}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
const blobData=async blob=>blob?new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Cannot read image'));r.readAsDataURL(blob)}):null;
async function backup(){try{const convert=async(arr,key)=>Promise.all(arr.map(async x=>({...x,[key]:await blobData(x[key])})));const payload={format:'trip-list-backup',version:2,exportedAt:new Date().toISOString(),stores:state.stores,items:await convert(state.items,'image'),expenses:await convert(state.expenses,'receipt'),settings:state.settings};download(new Blob([JSON.stringify(payload)],{type:'application/json'}),`trip-list-backup-${today()}.json`);toast('Backup created. Save it somewhere safe!')}catch(e){toast('Could not create backup: '+e.message)}}
function dataToBlob(v){if(v==null)return null;if(typeof v!=='string'||!/^data:image\/(png|jpeg|webp|gif);base64,/.test(v)||v.length>9e6)throw Error('Invalid image in backup.');const [header,base64]=v.split(','),raw=atob(base64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:header.slice(5,-7)})}
async function restoreBackup(file){let p;try{p=JSON.parse(await file.text())}catch{throw Error('Invalid JSON backup.')}if(p.format!=='trip-list-backup'||p.version!==2||!Array.isArray(p.stores)||!Array.isArray(p.items)||!Array.isArray(p.expenses)||p.stores.length>2000||p.items.length>20000||p.expenses.length>20000)throw Error('Unsupported or invalid backup.');const stores=p.stores.map(x=>({id:String(x.id),name:String(x.name).slice(0,70),budget:safeNum(x.budget)})),ids=new Set(stores.map(x=>x.id));if(ids.size!==stores.length)throw Error('Duplicate store IDs.');const items=p.items.map(x=>{if(!ids.has(x.storeId))throw Error('Item refers to missing store.');return {id:String(x.id),storeId:x.storeId,name:String(x.name).slice(0,100),category:String(x.category).slice(0,60),price:safeNum(x.price),qty:safeNum(x.qty,100000),currency:x.currency==='MYR'?'MYR':'JPY',bought:!!x.bought,image:dataToBlob(x.image)}}),expenses=p.expenses.map(x=>({id:String(x.id),store:String(x.store).slice(0,100),date:String(x.date).slice(0,10),category:String(x.category).slice(0,60),amount:safeNum(x.amount),currency:x.currency==='MYR'?'MYR':'JPY',method:String(x.method).slice(0,30),note:String(x.note||'').slice(0,300),receipt:dataToBlob(x.receipt)}));const settings={id:'main',budget:safeNum(p.settings?.budget||0),rate:p.settings?.rate==null?null:safeNum(p.settings.rate),rateDate:String(p.settings?.rateDate||''),rateFetched:String(p.settings?.rateFetched||'')};await new Promise((resolve,reject)=>{const tx=db.transaction(['stores','items','expenses','settings'],'readwrite');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);for(const name of ['stores','items','expenses','settings'])tx.objectStore(name).clear();for(const x of stores)tx.objectStore('stores').put(x);for(const x of items)tx.objectStore('items').put(x);for(const x of expenses)tx.objectStore('expenses').put(x);tx.objectStore('settings').put(settings)});await refresh()}
async function act(action,el){const key=el.dataset.id;try{switch(action){case 'store':storeDialog();break;case 'editstore':storeDialog(storeById(key));break;case 'deletestore':{const s=storeById(key);if(!s||!confirm(`Delete ${s.name} and ALL its shopping items? Expenses are kept.`))break;await new Promise((resolve,reject)=>{const tx=db.transaction(['stores','items'],'readwrite');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.objectStore('stores').delete(key);state.items.filter(x=>x.storeId===key).forEach(x=>tx.objectStore('items').delete(x.id))});await refresh();break}case 'item':itemDialog(null,el.dataset.store);break;case 'edititem':itemDialog(state.items.find(x=>x.id===key));break;case 'deleteitem':if(confirm('Delete this item?'))await del('items',key);break;case 'toggle':{const x=state.items.find(x=>x.id===key);if(x)await put('items',{...x,bought:!x.bought});break}case 'expense':expenseDialog();break;case 'editexpense':expenseDialog(state.expenses.find(x=>x.id===key));break;case 'deleteexpense':if(confirm('Delete this expense and its receipt?'))await del('expenses',key);break;case 'viewreceipt':{const x=state.expenses.find(x=>x.id===key);if(x?.receipt){const u=URL.createObjectURL(x.receipt);window.open(u,'_blank','noopener,noreferrer');setTimeout(()=>URL.revokeObjectURL(u),60000)}break}case 'rate':await getRate();break}}catch(e){toast(e.message||'Something went wrong.')}}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return}const b=e.target.closest('[data-action]');if(b)act(b.dataset.action,b)});document.addEventListener('input',e=>{if(e.target.id==='yenInput'){const v=Number(e.target.value);$('#rmInput').value=state.settings.rate!=null&&Number.isFinite(v)?(v*state.settings.rate).toFixed(2):''}if(e.target.id==='rmInput'){const v=Number(e.target.value);$('#yenInput').value=state.settings.rate!=null&&Number.isFinite(v)?(v/state.settings.rate).toFixed(2):''}if(['searchExpense','filterExpense'].includes(e.target.id)){const q=$('#searchExpense').value.toLowerCase(),c=$('#filterExpense').value;$('#expenseResults').innerHTML=expenseRows(state.expenses.filter(x=>(x.store+' '+x.note).toLowerCase().includes(q)&&(!c||x.category===c)))}});$('#backupBtn').onclick=backup;$('#settingsBtn').onclick=settingsDialog;
(async()=>{try{db=await openDB();await refresh();if(!state.settings.rateFetched||Date.now()-new Date(state.settings.rateFetched).getTime()>12*3600000)getRate()}catch(e){$('#content').innerHTML='<div class="empty"><b>Local storage is unavailable</b>Use Safari or a regular browser tab with site storage enabled. Avoid private mode.</div>';toast('Unable to open local storage: '+e.message)}})();
</script></body></html>
