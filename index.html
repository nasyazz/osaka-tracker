const utcDay=stamp=>Date.UTC(Number(stamp.slice(0,4)),Number(stamp.slice(5,7))-1,Number(stamp.slice(8,10)));

async function importSchedule(key){
 let added=0;
 for(const day of tripSchedule)for(let j=0;j<day.stops.length;j++){
  const token='day'+day.day+'-'+j;
  if(key&&token!==key)continue;
  if(state.places.some(p=>p.itineraryKey===token||(p.group===day.title&&p.name===day.stops[j].name)))continue;
  const st=day.stops[j],date=tripDates()[day.day-1]||'';state.places.push({id:uid(),itineraryKey:token,name:st.name,group:day.title,type:st.type,status:'Wishlist',date,time:st.time,estimated:0,currency:'JPY',address:st.name==='Hotel check-in / luggage drop'||st.name==='Hotel check-out'?'':st.name+', Japan',notes:st.notes,latitude:'',longitude:''});added++;
 }
 await save();render();alert(added?added+' itinerary stop(s) saved to Places. Add your hotel address in Settings.':'These itinerary stops are already in Places.');
}

async function photo(file){if(!file)return null;if(file.size>MAX_FILE)throw Error('Image must be 5 MB or less');const bytes=new Uint8Array(await file.arrayBuffer());let mime='';if(bytes[0]===0xff&&bytes[1]===0xd8&&bytes[2]===0xff)mime='image/jpeg';else if(bytes[0]===0x89&&bytes[1]===0x50&&bytes[2]===0x4e&&bytes[3]===0x47)mime='image/png';else if(bytes.length>12&&String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')mime='image/webp';if(!mime)throw Error('Unsupported image content');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read image'));r.readAsDataURL(new Blob([bytes],{type:mime}))})}

   if(childItems.length)state.items=state.items.map(x=>x.categoryId===id?{...x,categoryId:''}:x);
   if(shopCategory===id)shopCategory=null;
 }else{
   if(!confirm('Delete '+kind+' "'+name+'"? This cannot be undone.'))return;
   if(kind==='store'&&shopStore===id){shopStore=null;shopCategory=null;}
 }
 state[key]=state[key].filter(x=>x.id!==id);
 try{await save();render();toast('Removed from your list')}catch(err){state[key]=oldList;state.items=oldItems;shopCategory=oldCategory;shopStore=oldStore;throw err}
}

function changeTheme(){const options=[['dark','🌙 Midnight','Deep purple, comfortable at night'],['lavender','💜 Lavender','Soft purple and white'],['pink','🌸 Blush','Warm pink and cream'],['neutral','☁️ Minimal','Calm, neutral tones']];const host=$('themeOptions');host.replaceChildren();for(const [key,label,description] of options){const b=document.createElement('button');b.type='button';b.className='theme-choice';b.setAttribute('aria-pressed',String(state.settings.theme===key));const details=document.createElement('span');details.style.display='grid';const name=document.createElement('strong');name.textContent=label;const hint=document.createElement('small');hint.textContent=description;details.append(name,hint);const check=document.createElement('span');check.textContent=state.settings.theme===key?'✓':'›';b.append(details,check);b.onclick=async()=>{const previous=state.settings.theme;state.settings.theme=key;document.body.className=key==='lavender'?'':key;try{await save();$('themePicker').close();render()}catch(e){state.settings.theme=previous;document.body.className=previous==='lavender'?'':previous;alert('Theme save failed: '+e.message)}};host.append(b)}safeShowDialog($('themePicker'))}

async function deleteGalleryPhoto(){const key=galleryKind==='expense'?'receipt':'image',coll=galleryKind==='expense'?state.expenses:galleryKind==='place'?state.places:state.items,rec=coll.find(x=>x.id===galleryRecordId);if(!rec||!galleryPhotos.length)return;if(!confirm('Remove this photo? This cannot be undone.'))return;const before={images:rec[key+'s'],single:rec[key]},remaining=pictures(rec,key).filter((_,i)=>i!==galleryIndex);rec[key+'s']=remaining;delete rec[key];try{await save();if(remaining.length){galleryPhotos=remaining;galleryIndex=Math.min(galleryIndex,remaining.length-1);updateGallery()}else $('gallery').close();render();toast('Photo removed')}catch(e){rec[key+'s']=before.images;rec[key]=before.single;alert(e.message)}}
function delegate(e){const v=e.target.closest('button[data-view],a[data-view],[role=button][data-view]');if(v){view=v.dataset.view;render();window.scrollTo({top:0,behavior:'instant'});return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action,id=a.dataset.id??'';const [kind,recordId]=id.split(':');if(action==='goto'){view=id;render();window.scrollTo({top:0,behavior:'instant'})}else if(action==='addstop'){pendingDayDate=id;openModal('place')}else if(action==='adddayfood'){pendingDayDate=id;openModal('food')}else if(action==='adddayexplore'){pendingDayDate=id;openModal('explorePlace')}else if(action==='adddaynote'){pendingDayDate=id;openModal('dayNote')}else if(action==='cleardates'){if(confirm('Clear the start and end dates? Existing places and day notes are kept so you can restore them later.')){const old={...state.settings};state.settings.tripDate='';state.settings.tripEndDate='';save().then(()=>{render();toast('Trip dates cleared')}).catch(err=>{state.settings=old;alert(err.message)})}}else if(action==='visitplace'){const p=state.places.find(x=>x.id===id);if(p){const previous=p.status;p.status=p.status==='Visited'?'Planned':'Visited';save().then(()=>{render();toast(p.status==='Visited'?'Visited! 🌸':'Visit undone')}).catch(err=>{p.status=previous;alert(err.message)})}}else if(action==='back'){if(id==='category')shopCategory=null;else{shopCategory=null;shopStore=null}render()}else if(action==='storepage'){shopStore=id;shopCategory=null;render()}else if(action==='folder'){shopCategory=id;render()}else if(action==='importitinerary')importSchedule(null).catch(err=>alert(err.message));else if(action==='importstop')importSchedule(id).catch(err=>alert(err.message));else if(action==='purchase')purchaseItem(id);else if(action==='add')openModal(id);else if(action==='addsub'){const p=state.explorePlaces.find(x=>x.id===id);if(p){const name=prompt('What do you want to look for at this place?');if(name?.trim()){p.todos??=[];p.todos.push({id:uid() ew receipt")}}}
async function purchaseItem(id){const item=state.items.find(x=>x.id===id);if(!item)return;if(item.status==='Purchased'){if(!confirm('Move this item back to wishlist? Linked expenses will remain unchanged.'))return;item.status='Wishlist';try{await save();render()}catch(e){item.status='Purchased';alert('Could not save: '+e.message)}return}const previous=item.status;item.status='Purchased';try{await save();render()}catch(e){item.status=previous;alert('Could not save: '+e.message);return}if(confirm('Purchased! Would you like to record this expense and attach a receipt now?')){pendingPurchase=id;openModal('expense');const f=$('entryForm');f.elements.namedItem('store').value=storeName(item.storeId);f.elements.namedItem('amount').value=num(item.price)*num(item.qty||1);f.elements.namedItem('currency').value=item.currency;f.elements.namedItem('category').value=categoryName(item.categoryId);f.elements.namedItem('itemId').value=item.id}}
