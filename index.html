function plannedBudgetView(){
 const budget=num(state.settings.budget),used=spent(),shopping=wishlistTotal(state.items.filter(x=>x.status!=='Skipped'&&!state.expenses.some(e=>e.itemId===x.id))),prep=state.preparations.filter(x=>!['Paid','Ready'].includes(x.status)).reduce((t,x)=>t+calcRM(x.estimated,x.currency),0),unspent=budget-used,afterPlan=unspent-shopping-prep;
 const missingRate=!state.rate&&(state.items.some(x=>x.currency==='JPY')||state.preparations.some(x=>x.currency==='JPY')||state.expenses.some(x=>x.currency==='JPY'));
 return `<section class="budget-bottom"><h2>💜 Your full shopping budget</h2><div class="summary-row"><span>Estimated trip budget</span><strong>${money(budget)}</strong></div><div class="summary-row"><span>Already spent (recorded expenses)</span><strong>− ${money(used)}</strong></div><div class="summary-row"><span>Available before future purchases</span><strong>${money(unspent)}</strong></div><div class="summary-row"><span>Wishlist not yet recorded as expenses</span><strong>− ${money(shopping)}</strong></div><div class="summary-row"><span>Unpaid preparation estimates</span><strong>− ${money(prep)}</strong></div><div class="summary-row"><span>Estimated balance after plans</span><strong class="budget-final">${missingRate?'Exchange rate needed':money(afterPlan)}</strong></div>${afterPlan<0&&!missingRate?'<p class="notice">⚠️ Your plans exceed your remaining budget. Review your wishlist or preparations.</p>':''}<p class="muted">Only unpaid wishlist items and preparations are reserved here. Purchased items already in Expenses are not deducted twice. Preparation statuses are estimates, not proof of payment. This forecast excludes other future costs not yet entered.</p>${missingRate?'<p class="notice">Connect to the internet to update the JPY → MYR exchange rate before trusting totals.</p>':''}</section>`;
}
function itineraryView(){
 return `<section class="card"><h2>🗓️ My 6-day itinerary</h2><p class="muted">Six days of places and experiences. Times are indicative and may change.</p><div class="row">${button('importitinerary','all','＋ Add itinerary to My Places')}</div><p class="privacy-note">Your tour company and private booking details are not published here. Imported stops can be edited or deleted in Places. Importing again skips previously imported stops.</p></section>`+tripSchedule.map((day,i)=>`<section class="itinerary-day"><span class="pill">Day ${i+1}</span><h3>${esc(day.title)}</h3><p class="muted">${esc(day.description)}</p>${day.stops.map((stop,j)=>`<div class="itinerary-stop"><span class="stop-index">${j+1}</span><div class="grow"><strong>${esc(stop.name)}</strong><small>${esc([stop.time,stop.type].filter(Boolean).join(' · '))}</small><div class="stop-actions"><a class="btn" style="font-size:12px;padding:9px 11px;text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.name+', Japan')}">🗺 Map</a>${state.places.some(p=>p.itineraryKey==='day'+day.day+'-'+j)?'<span class="pill">✓ In My Places</span>':`<button class="secondary small" data-action="importstop" data-id="${esc('day'+day.day+'-'+j)}">＋ Save place</button>`}</div></div></div>`).join('')}</section>`).join('');
}
async function importSchedule(key){
 let added=0;
 for(const day of tripSchedule)for(let j=0;j<day.stops.length;j++){
  const token='day'+day.day+'-'+j;
  if(key&&token!==key)continue;
  if(state.places.some(p=>p.itineraryKey===token||(p.group===day.title&&p.name===day.stops[j].name)))continue;
  const st=day.stops[j];state.places.push({id:uid(),itineraryKey:token,name:st.name,group:day.title,type:st.type,status:'Wishlist',date:"",time:st.time,estimated:0,currency:'JPY',address:st.name==='Hotel check-in / luggage drop'||st.name==='Hotel check-out'?'':st.name+', Japan',notes:st.notes,latitude:'',longitude:''});added++;
 }
 await save();render();alert(added?added+' itinerary stop(s) saved to Places. Add your hotel address in Settings.':'These itinerary stops are already in Places.');
}

function nav(){const tabs=[['home','⌂','Home'],['itinerary','🗓','Itinerary'],['places','📍','Places'],['shop','🛍','Shop'],['convert','⇄','Convert'],['expenses','▤','Spent'],['tax','🧾','Tax-free'],['ready','✈','Ready'],['more','☰','More']];$('nav').innerHTML=tabs.map(([id,icon,label])=>`<button data-view="${id}" class="${view===id?'active':''}"><span>${icon}</span>${label}</button>`).join('')}
function render(){nav();const views={home:()=>homeView()+analyticsView()+`<section class="card"><div class="row between"><h2>✈ Before departure</h2>${button('goto','more','Open checklist')}</div><p>${state.checklist.filter(x=>x.done).length} / ${state.checklist.length} tasks ready</p><div class="progress"><div style="width:${state.checklist.length?state.checklist.filter(x=>x.done).length/state.checklist.length*100:0}%"></div></div></section>`,places:placesView,itinerary:itineraryView,shop:()=>shopView()+plannedBudgetView(),convert:convertView,expenses:expenseView,tax:taxView,ready:readyView,more:moreView};$('view').innerHTML=views[view]();if(view==='convert')wireConverter()}
function analyticsView(){const groups=new Map();for(const e of state.expenses){const k=(e.category||'Other').trim()||'Other';groups.set(k,(groups.get(k)||0)+calcRM(e.amount,e.currency))}const sorted=[...groups].sort((a,b)=>b[1]-a[1]).slice(0,7),max=Math.max(1,...sorted.map(x=>x[1]));const planned=wishlistTotal(state.items),spentRM=spent(),budget=num(state.settings.budget);return `<section class="card"><div class="row between"><h2>📊 Spending insights</h2><span class="pill">Actual expenses</span></div><div class="metric-grid"><div class="metric"><small>Budget</small><strong>${money(budget)}</strong></div><div class="metric"><small>Spent</small><strong>${money(spentRM)}</strong></div><div class="metric"><small>Left</small><strong>${money(budget-spentRM)}</strong></div><div class="metric"><small>Wishlist plan</small><strong>${money(planned)}</strong></div></div><h3>Spending by category</h3>${sorted.map(([name,value])=>`<div class="chart-row"><div class="row between"><span>${esc(name)}</span><strong>${money(value)}</strong></div><div class="chart-track"><div style="width:${Math.min(100,value/max*100)}%"></div></div></div>`).join('')||'<p class="muted">Add expenses to see your spending chart.</p>'}<p class="muted">Wishlist is planned spending and is not added to actual expenses. JPY estimates use the saved exchange rate.</p></section>`}
function homeView(){const spentRM=spent(),budget=num(state.settings.budget),remaining=budget-spentRM,days=state.settings.tripDate?Math.ceil((new Date(state.settings.tripDate+'T00:00:00')-Date.now())/86400000):null,plan=wishlistTotal(state.items),prep=state.preparations.reduce((v,x)=>v+calcRM(x.estimated,x.currency),0);return `<section class="hero-new"><div class="eyebrow">YOUR TRAVEL DASHBOARD ✦</div><h1>Ready for your next adventure?</h1><div class="hero-balance"><small>Available trip budget</small><strong>${money(remaining)}</strong></div><div class="progress"><div style="width:${budget?Math.min(100,Math.max(0,spentRM/budget*100)):0}%"></div></div><div class="hero-stats"><span>Budget <b>${money(budget)}</b></span><span>Spent <b>${money(spentRM)}</b></span></div></section>${remaining<0?'<p class="notice">⚠️ Over budget — review your expenses.</p>':''}<div class="dashboard-grid"><button class="dash-tile" data-view="shop"><span>🛍️</span><b>Shopping</b><small>${state.items.length} items · ${money(plan)} planned</small></button><button class="dash-tile" data-view="expenses"><span>💳</span><b>Expenses</b><small>${state.expenses.length} records · ${money(spentRM)}</small></button><button class="dash-tile" data-view="places"><span>🎢</span><b>Experiences</b><small>${state.places.length} plans</small></button><button class="dash-tile" data-view="ready"><span>✈️</span><b>Trip ready</b><small>${money(prep)} preparation plan</small></button></div><section class="card"><div class="row between"><h2>At a glance</h2><span class="pill">${'6-day itinerary'}</span></div><div class="summary-row"><span>Wishlist planned</span><strong>${money(plan)}</strong></div><div class="summary-row"><span>Preparation planned</span><strong>${money(prep)}</strong></div><div class="summary-row"><span>Unspent trip budget</span><strong>${money(remaining)}</strong></div><p class="muted">Plans are not deducted from your budget until recorded as expenses.</p></section><section class="card"><h2>Quick add</h2><div class="action-grid">${button('add','item','＋ Wishlist')}${button('add','expense','＋ Expense')}${button('add','place','＋ Activity')}${button('add','preparation','＋ Preparation')}</div></section><section class="card"><div class="row between"><h2>Currency today</h2>${button('refresh','rate','↻ Update')}</div><p class="muted">${esc(rateStatus)}</p><h2>${state.rate?money(1000*state.rate.value):'Rate unavailable'} <small class="muted">per ¥1,000</small></h2></section>`}
function shopView(){const total=wishlistTotal(state.items),remaining=num(state.settings.budget)-spent();let header=`<div class="row between"><h2>My wishlist</h2>${button('add','item','＋ Item')}</div><div class="stat-strip"><div><small>Planned shopping</small><strong>${money(total)}</strong></div><div><small>Trip budget left</small><strong>${money(remaining)}</strong></div></div>`;
if(shopCategory){const cat=state.categories.find(c=>c.id===shopCategory),store=state.stores.find(x=>x.id===shopStore);if(!cat||!store){shopCategory=null;return shopView()}const items=state.items.filter(x=>x.categoryId===cat.id&&x.storeId===store.id);return `<button class="back-link" data-action="back" data-id="category">← ${esc(store.name)}</button><div class="row between"><h2>📂 ${esc(cat.name)}</h2>${button('edit','category:'+cat.id,'Edit')}</div>${header.replace('<div class="row between"><h2>My wishlist</h2>','<div class="row between"><h2>Items</h2>')}<div class="category-summary"><strong>${money(wishlistTotal(items))}</strong><span>${items.filter(x=>x.status==='Purchased').length} of ${items.length} purchased</span></div>${items.map(itemRow).join('')||'<section class="card empty">No items yet. Add your first one!</section>'}`}
if(shopStore){const store=state.stores.find(x=>x.id===shopStore);if(!store){shopStore=null;return shopView()}const items=state.items.filter(x=>x.storeId===store.id),limit=num(store.budget);return `<button class="back-link" data-action="back" data-id="store">← All stores</button><div class="row between"><h2>🏬 ${esc(store.name)}</h2>${button('edit','store:'+store.id,'Edit')}</div><div class="stat-strip"><div><small>Store wishlist</small><strong>${money(wishlistTotal(items))}</strong></div><div><small>Store budget left</small><strong>${limit?money(limit-wishlistTotal(items)):'Not set'}</strong></div></div><div class="row between"><h2>Categories</h2>${button('add','category','＋ Category')}</div>${state.categories.filter(c=>c.storeId===store.id).map(c=>{const list=items.filter(x=>x.categoryId===c.id);return `<button class="folder-card" data-action="folder" data-id="${esc(c.id)}"><span class="folder-emoji">📂</span><span class="folder-copy"><b>${esc(c.name)}</b><small>${list.filter(x=>x.status==='Purchased').length}/${list.length} purchased · ${money(wishlistTotal(list))}</small></span><span>›</span></button>`}).join('')}${items.filter(x=>!state.categories.some(c=>c.id===x.categoryId)).map(itemRow).join('')}<p class="muted">Open a category to tick purchases and edit items.</p>`}
return `${header}<div class="row between"><h2>Your stores</h2>${button('add','store','＋ Store')}</div>${state.stores.map(st=>{const items=state.items.filter(x=>x.storeId===st.id),limit=num(st.budget),plan=wishlistTotal(items);return `<button class="folder-card" data-action="storepage" data-id="${esc(st.id)}"><span class="folder-emoji">🏬</span><span class="folder-copy"><b>${esc(st.name)}</b><small>${items.length} items · ${money(plan)} planned</small>${limit?`<small>${money(limit-plan)} store budget left</small>`:''}</span><span>›</span></button>`}).join('')||'<section class="card empty">Add a store such as GU or Donki to get started.</section>'}<section class="card"><h2>Shopping overview</h2><p>${state.items.filter(x=>x.status==='Purchased').length} of ${state.items.length} purchased</p><p class="muted">Open a store → category → item. Big buttons make shopping easier on iPhone.</p></section>`}
function shopResults(items){return items.map(itemRow).join('')}
function itemRow(x){const purchased=x.status==='Purchased',price=num(x.price)*num(x.qty||1);return `<article class="product-card"><div class="product-top">${photoThumb(x,'image','item')}<div class="product-info"><button class="product-title" data-action="edit" data-id="item:${esc(x.id)}">${esc(x.name)}</button><div class="muted">${money(x.price,x.currency)} × ${num(x.qty||1)}</div><strong>${money(price,x.currency)}</strong>${x.currency==='JPY'&&state.rate?`<small>≈ ${money(calcRM(price,'JPY'))}</small>`:''}</div></div><div class="product-actions"><button class="${purchased?'purchased-button':'purchase-button'}" data-action="purchase" data-id="${esc(x.id)}">${purchased?'✓ Purchased · Tap to undo':'✓ Mark purchased'}</button>${button('edit','item:'+x.id,'Edit')}${button('delete','item:'+x.id,'Delete','danger')}</div></article>`}
function convertView(){return `<section class="card"><h2>Instant currency converter</h2><p class="muted" id="rateLabel">${esc(rateStatus)}</p><div class="stack"><label>From currency<select id="fromCurrency"><option value="JPY">Japanese Yen (JPY)</option><option value="MYR">Malaysian Ringgit (MYR)</option></select></label><label>Amount<input id="fromAmount" type="number" min="0" step="any" inputmode="decimal" value="1000"></label><div class="row">${button('swap','currency','⇅ Swap currencies')}${button('refresh','rate','↻ Refresh rate')}</div><div class="card" style="background:var(--bg)"><p class="muted">Converted amount</p><h1 id="converted">—</h1></div></div><p class="muted">Reference exchange rates only. Your card or cash provider may charge different rates or fees. Last saved rate is available offline.</p></section>`}
function expenseView(){return `<div class="row between"><h2>Expense journal</h2>${button('add','expense','+ Expense')}</div><section class="card hero"><p class="muted">Actual recorded spending</p><strong>${money(spent())}</strong><p class="muted">JPY expenses require a saved conversion rate for RM totals.</p></section><div class="card"><label>Search expenses<input id="expenseSearch" placeholder="Merchant, category, notes..." type="search"></label><div id="expenseResults">${expenseRows(state.expenses)}</div></div>`}
function expenseRows(items){return items.slice().reverse().map(x=>`<div class="item">${photoThumb(x,'receipt','expense')}<div class="grow truncate"><strong>${esc(x.store||'Expense')}</strong><div class="muted">${esc(x.date)} · ${esc(x.category||'Other')}</div><div class="mini">${x.itemId?'Linked: '+esc(state.items.find(i=>i.id===x.itemId)?.name||'Deleted item'):''}</div><strong>${money(x.amount,x.currency)}</strong>${x.currency==='JPY'&&state.rate?'<div class="muted">≈ '+money(calcRM(x.amount,x.currency))+'</div>':''}</div><div class="stack">${button('edit','expense:'+x.id,'Edit')}${button('delete','expense:'+x.id,'Delete','danger')}${pictures(x,'receipt').length?button('gallery','expense:'+x.id,'Photos'):''}</div></div>`).join('')||'<div class="empty">No recorded expenses yet</div>'}

function taxView(){const records=state.expenses.filter(x=>x.taxFree),total=records.reduce((v,x)=>v+calcRM(x.amount,x.currency),0);return `<div class="row between"><h2>🧾 Tax-free receipts</h2>${button('add','expense','＋ Receipt')}</div><section class="card hero"><p>Tax-free purchases recorded</p><strong>${money(total)}</strong><p>${records.length} receipts · estimates only</p></section><section class="card"><h3>Japan tax-free tracker</h3><p class="muted">Attach receipt photos in Expenses and enable “Tax-free purchase”. Tax eligibility depends on the store, purchase, residency, current rules and export conditions. This tracker does not verify refunds.</p></section>${records.map(x=>`<section class="card tax-card"><div class="row between"><strong>${esc(x.store)}</strong><strong>${money(x.amount,x.currency)}</strong></div><p class="muted">${esc(x.date)} · Tax rate entered: ${num(x.taxRate)}%</p><p>Estimated included tax: ${money(num(x.amount)*num(x.taxRate)/(100+num(x.taxRate)),x.currency)}</p><div class="row">${pictures(x,'receipt').length?button('gallery','expense:'+x.id,'View receipt'):''}${button('edit','expense:'+x.id,'Edit')}</div></section>`).join('')||'<section class="card empty">No tax-free receipts yet. Add an expense and tick Tax-free.</section>'}`}
function readyView(){
 const rate=state.rate?.value||0, converted=(amount,currency)=>currency==='JPY'?rate?num(amount)*rate:null:num(amount);
 const paid={jpy:0,myr:0,wise:0};
 for(const x of state.expenses){const method=x.method||'';if(method==='Cash JPY')paid.jpy+=x.currency==='JPY'?num(x.amount):rate?num(x.amount)/rate:0;else if(method==='Cash MYR')paid.myr+=x.currency==='MYR'?num(x.amount):converted(x.amount,x.currency)||0;else if(method==='Wise')paid.wise+=x.currency==='MYR'?num(x.amount):converted(x.amount,x.currency)||0;}
 const jpy=num(state.settings.cashJPY)-paid.jpy,myr=num(state.settings.cashMYR)-paid.myr,wise=num(state.settings.wiseMYR)-paid.wise;
 const total=rate?jpy*rate+myr+wise:null;
 const start=state.settings.tripDate,end=state.settings.tripEndDate,days=start&&end?Math.max(0,Math.round((new Date(end+'T00:00:00')-new Date(start+'T00:00:00'))/86400000)+1):0;
 const food=num(state.settings.dailyFoodMYR),foodSpent=state.expenses.filter(x=>String(x.category).toLowerCase().includes('food')).reduce((sum,x)=>sum+calcRM(x.amount,x.currency),0);
 return `<div class="row between"><h2>✈ Trip Ready & Money</h2>${button('add','settings','Edit money')}</div><section class="card hero"><p class="muted">Estimated available money</p><strong>${total===null?'Rate needed':money(total)}</strong><p>Based on starting balances minus expenses assigned to each source</p></section>
 <div class="grid"><div class="card"><p class="muted">💴 Japan cash</p><h2>${money(jpy,'JPY')}</h2><p class="muted">${rate?money(jpy*rate):'JPY to MYR rate unavailable'}</p></div><div class="card"><p class="muted">💳 Wise (RM equivalent)</p><h2>${money(wise)}</h2></div><div class="card"><p class="muted">💵 MYR cash</p><h2>${money(myr)}</h2></div></div>
 ${(jpy<0||myr<0||wise<0)?'<p class="notice">⚠️ A money source is below zero. Check recorded expenses or starting balances.</p>':''}
 <section class="card"><h2>🍱 Daily food budget</h2><div class="grid"><div><p class="muted">Per day</p><h2>${money(food)}</h2><p class="muted">${rate?money(food/rate,'JPY'):'JPY estimate unavailable'}</p></div><div><p class="muted">Trip allowance (${days||'—'} days)</p><h2>${days?money(days*food):'Set trip dates'}</h2><p class="muted">Food expenses: ${money(foodSpent)}</p></div></div>${days?`<p class="muted">Food allowance remaining: ${money(days*food-foodSpent)}</p>`:''}</section>
 <section class="card"><div class="row between"><h2>📋 To prepare / book</h2>${button('add','preparation','+ Add')}</div>${totalDisplay(state.preparations.reduce((a,x)=>a+calcRM(x.estimated,x.currency),0),'Preparation estimated total')}${totalDisplay(state.preparations.reduce((a,x)=>a+calcRM(x.actual,x.currency),0),'Preparation actual total')}${state.preparations.map(x=>`<div class="item"><div class="grow"><strong>${esc(x.name)}</strong><div class="muted">${esc(x.status||'To do')} · ${esc(x.due||'No due date')}</div><div class="mini">Estimate ${money(x.estimated,x.currency)}${num(x.actual)>0?' · Actual '+money(x.actual,x.currency):''}</div>${x.notes?`<p class="muted">${esc(x.notes)}</p>`:''}</div><div class="stack">${button('edit','preparation:'+x.id,'Edit')}${button('delete','preparation:'+x.id,'Delete','danger')}</div></div>`).join('')||'<p class="muted">Add eSIM, return bus, airport transfer, insurance, or anything else.</p>'}<p class="muted">Preparation estimates are plans, not actual expenses. Add paid purchases to the Expense Journal to deduct money.</p></section>
 <section class="card"><h2>How balances work</h2><p class="muted">Enter starting cash and Wise balances in Edit money. Record purchases under Cash JPY, Cash MYR or Wise to subtract them. Card/Other spending is tracked in expenses but not deducted from these balances. Currency conversion uses the saved reference rate, not Wise's actual rate. Transfers or top-ups require adjusting starting balances; this is a planning tracker, not a bank connection.</p></section>`;
}
function hotelDirections(p){const hotel=(state.settings.hotelAddress||state.settings.hotelName||'').trim();if(!hotel)return '';const destination=[p.address,p.name].filter(Boolean).join(' ');return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(hotel)+'&destination='+encodeURIComponent(destination)+'&travelmode=transit'}
function hotelMap(){const hotel=(state.settings.hotelAddress||state.settings.hotelName||'').trim();return hotel?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(hotel):''}
function mapLink(p){const q=[p.address,p.name].filter(Boolean).join(' ');return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}

arance</p><div class="row">${button('add','settings','Edit settings')}${button('theme','all','Change theme')}</div></section><section class="card"><h2>💾 Backup & restore</h2><p class="muted">Backup includes photos and receipts. Store your backup securely; it contains personal spending details.</p><div class="row">${button('backup','all','Download backup')}${button('restore','all','Restore backup')}</div><p class="muted">Restore replaces all existing data. Browser storage can be deleted; keep backups outside Safari.</p></section>`}
function fieldHtml([key,label,type],obj){const v=obj?.[key]??(key==='qty'?1:key==='currency'?'JPY':key==='status'?(type==='prepstatus'?'To do':'Wishlist'):key==='method'?'Wise':key==='date'?today():'');let control='';if(type==='store')control=`<select name="${key}" required><option value="">Choose store</option>${state.stores.map(s=>`<option value="${esc(s.id)}" ${s.id===v?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;else if(type==='category')control=`<select name="${key}"><option value="">Uncategorized</option>${state.categories.filter(c=>!obj?.storeId||c.storeId===obj.storeId).map(c=>`<option value="${esc(c.id)}" ${c.id===v?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;else if(type==='item')control=`<select name="${key}"><option value="">No linked item</option>${state.items.map(i=>`<option value="${esc(i.id)}" ${i.id===v?'selected':''}>${esc(i.name)} (${esc(storeName(i.storeId))})</option>`).join('')}</select>`;else if(type==='currency'||type==='status'||type==='method'){let options=type==='currency'?['JPY','MYR']:type==='status'?['Wishlist','Purchased','Skipped']:['Cash JPY','Cash MYR','Wise','Card','Other'];control=`<select name="${key}">${options.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`}else if(type==='placetype')control=`<select name="${key}">${['Attraction','Ride / activity','Shopping','Food / café','Rental','Transport','Accommodation','Other'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;else if(type==='placestatus')control=`<select name="${key}">${['Wishlist','Planned','Booked','Visited','Skipped'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;else if(type==='dateoptional')control=`<input name="${key}" type="date" value="${esc(v)}">`;else if(type==='coordinate')control=`<input name="${key}" type="number" step="any" placeholder="Optional" value="${esc(v)}">`;else if(type==='prepstatus')control=`<select name="${key}">${['To do','Booked','Paid','Ready'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;else if(type==='textarea')control=`<textarea name="${key}">${esc(v)}</textarea>`;else if(type==='image')control=`<input name="${key}" type="file" accept="image/jpeg,image/png,image/webp" multiple><span class="muted">Choose from Photo Library or take a photo · multiple images · 5 MB each</span>${v?'<span class="muted">Current photo kept unless replaced</span>':''}`;else if(type==='check')control=`<input name="${key}" type="checkbox" style="width:25px" ${v?'checked':''}>`;else control=`<input name="${key}" type="${type}" value="${esc(v)}" ${type==='number'?'min="0" step="any" inputmode="decimal"':''} ${['name','amount','price','title','budget'].includes(key)?'required':''} ${key==='date'?'required':''}>`;return `<label>${esc(label)}${control}</label>`}
function openModal(kind,id=null){modalKind=kind;editing=id;const collection=kind==='place'?'places':kind==='preparation'?'preparations':kind==='note'?'notes':kind==='category'?'categories':kind==='store'?'stores':kind==='item'?'items':kind==='expense'?'expenses':kind==='packing'?'packing':kind==='checklist'?'checklist':null;const obj=kind==='settings'?state.settings:collection?state[collection].find(x=>x.id===id):null;$('modalTitle').textContent=(id?'Edit ':'Add ')+kind;$('fields').innerHTML=fields[kind].map(f=>fieldHtml(f,obj)).join('');$('modal').showModal();if(kind==='category'&&shopStore&&!id){$('fields').querySelector('[name=storeId]').value=shopStore}if(kind==='item'&&shopStore&&!id){const select=$('fields').querySelector('[name=storeId]');select.value=shopStore;select.dispatchEvent(new Event('change'));if(shopCategory)$('fields').querySelector('[name=categoryId]').value=shopCategory}if(kind==='item'){$('fields').querySelector('[name=storeId]').addEventListener('change',e=>{const select=$('fields').querySelector('[name=categoryId]');select.innerHTML='<option value="">Uncategorized</option>'+state.categories.filter(c=>c.storeId===e.target.value).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')})}}
async function photo(file){if(!file)return null;if(file.size>MAX_FILE)throw Error('Image must be 5 MB or less');const bytes=new Uint8Array(await file.arrayBuffer());let mime='';if(bytes[0]===0xff&&bytes[1]===0xd8&&bytes[2]===0xff)mime='image/jpeg';else if(bytes[0]===0x89&&bytes[1]===0x50&&bytes[2]===0x4e&&bytes[3]===0x47)mime='image/png';else if(bytes.length>12&&String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')mime='image/webp';if(!mime)throw Error('Unsupported image content');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read image'));r.readAsDataURL(new Blob([bytes],{type:mime}))})}
async function submitForm(e){e.preventDefault();const btn=$('submit');btn.disabled=true;try{const form=e.target,obj=modalKind==='settings'?{...state.settings}:editing?{...state[modalKind==='place'?'places':modalKind==='preparation'?'preparations':modalKind==='note'?'notes':modalKind==='category'?'categories':modalKind==='store'?'stores':modalKind==='item'?'items':modalKind==='expense'?'expenses':modalKind==='checklist'?'checklist':'packing'].find(x=>x.id===editing)}:{id:uid()};for(const [key,,type] of fields[modalKind]){const el=form.elements.namedItem(key);if(type==='image'){if(el.files.length){if(el.files.length>12||pictures(obj,key).length+el.files.length>12)throw Error('Maximum 12 photos per entry');const added=[];for(const file of el.files)added.push(await photo(file));obj[key+'s']=[...pictures(obj,key),...added];delete obj[key]}}else if(type==='check')obj[key]=el.checked;else if(type==='number'){if(!Number.isFinite(Number(el.value))||Number(el.value)<0)throw Error('Invalid '+key);obj[key]=Number(el.value)}else obj[key]=el.value.trim()}if(modalKind==='place'){if(!obj.name||obj.name.length>180||!['JPY','MYR'].includes(obj.currency))throw Error('Enter a valid place name and currency');for(const [k,max] of [['latitude',90],['longitude',180]]){if(obj[k]!==''&&(!Number.isFinite(Number(obj[k]))||Math.abs(Number(obj[k]))>max))throw Error('Invalid '+k)}}if(modalKind==='preparation'){if(!obj.name||!['JPY','MYR'].includes(obj.currency)||!['To do','Booked','Paid','Ready'].includes(obj.status))throw Error('Invalid preparation item')}if(modalKind==='item'){if(!state.stores.some(s=>s.id===obj.storeId))throw Error('Select a valid store');if(obj.categoryId&&!state.categories.some(c=>c.id===obj.categoryId&&c.storeId===obj.storeId))throw Error('Category does not belong to selected store');if(!Number.isInteger(obj.qty)||obj.qty<1||obj.qty>9999)throw Error('Quantity must be 1–9999')}if(modalKind==='category'&&!state.stores.some(s=>s.id===obj.storeId))throw Error('Select a store');if(modalKind==='expense'){if(obj.itemId&&!state.items.some(i=>i.id===obj.itemId))throw Error('Linked item no longer exists');if(obj.itemId){const item=state.items.find(i=>i.id===obj.itemId);item.status='Purchased'}}if(modalKind==='settings')state.settings=obj;else{const key=modalKind==='place'?'places':modalKind==='preparation'?'preparations':modalKind==='note'?'notes':modalKind==='category'?'categories':modalKind==='store'?'stores':modalKind==='item'?'items':modalKind==='expense'?'expenses':modalKind==='checklist'?'checklist':'packing';if(editing)state[key]=state[key].map(x=>x.id===editing?obj:x);else state[key].push(obj)}await save();$('modal').close();render()}catch(err){alert('Could not save: '+err.message)}finally{btn.disabled=false}}
async function fetchRate(){rateStatus='Updating exchange rate...';if(view==='convert')render();try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);let data;try{const r=await fetch('https://latest.currency-api.pages.dev/v1/currencies/jpy.json',{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('Exchange service unavailable');data=await r.json()}finally{clearTimeout(timer)}const value=Number(data?.jpy?.myr);if(!(value>0&&value<1))throw Error('Invalid exchange rate');state.rate={value,date:String(data.date||today()).slice(0,10)};await save();rateStatus='Online reference rate · '+state.rate.date}catch(e){rateStatus=state.rate?'Offline saved rate · '+state.rate.date:'No exchange rate available · connect to internet'}if(view==='convert')render()}
function wireConverter(){if(state.rate&&rateStatus==='Not fetched')rateStatus='Saved rate · '+state.rate.date;$('rateLabel').textContent=rateStatus;const update=()=>{let v=Number($('fromAmount').value),c=$('fromCurrency').value;$('converted').textContent=!state.rate?'Rate unavailable':money(c==='JPY'?v*state.rate.value:v/state.rate.value,c==='JPY'?'MYR':'JPY')};$('fromAmount').addEventListener('input',update);$('fromCurrency').addEventListener('change',update);update()}
async function backup(){const blob=new Blob([JSON.stringify({app:'Trip List 4.0',version:1,exportedAt:new Date().toISOString(),data:state})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='trip-list-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),15000)}
async function restore(file){if(!file||file.size>MAX_BACKUP)throw Error('Backup exceeds 35 MB');const raw=JSON.parse(await file.text());if(!['Trip List 3.0','Trip List 4.0'].includes(raw.app)||raw.version!==1)throw Error('Unsupported backup format');const restored=normalize(raw.data);if(!confirm('Replace ALL existing local data with this backup? This cannot be undone.'))return;const old=state;state=restored;try{await save()}catch(e){state=old;throw e}document.body.className=state.settings.theme==='lavender'?'':state.settings.theme;render();alert('Backup restored successfully')}
async function remove(kind,id){const key={place:'places',preparation:'preparations',store:'stores',category:'categories',item:'items',expense:'expenses',packing:'packing',checklist:'checklist',note:'notes'}[kind];if(!key)return;const dependencies=kind==='store'?(state.categories.some(x=>x.storeId===id)||state.items.some(x=>x.storeId===id)):kind==='category'?state.items.some(x=>x.categoryId===id):false;if(dependencies){alert('Remove related categories/items first.');return}if(!confirm('Delete this '+kind+'?'))return;state[key]=state[key].filter(x=>x.id!==id);await save();render()}
function changeTheme(){const themes=['lavender','pink','neutral','dark'];const next=themes[(themes.indexOf(state.settings.theme)+1)%themes.length];state.settings.theme=next;document.body.className=next==='lavender'?'':next;save().catch(e=>alert('Theme save failed: '+e.message));render()}
let galleryPhotos=[],galleryIndex=0;
const openCategories=new Set();
function photoThumb(record,key,kind){const photos=pictures(record,key);return photos.length?`<button type="button" class="photo-button" data-action="gallery" data-id="${kind}:${esc(record.id)}" aria-label="View ${photos.length} photos"><img src="${photos[0]}" alt="${kind==='expense'?'Receipt':'Item'} photo"><span class="photo-count">${photos.length} 📷</span></button>`:`<div class="thumb" style="display:grid;place-items:center">📷</div>`}
function showGallery(kind,id){const record=(kind==='expense'?state.expenses:kind==='place'?state.places:state.items).find(x=>x.id===id);galleryPhotos=pictures(record,kind==='expense'?'receipt':'image');galleryIndex=0;if(!galleryPhotos.length)return;$('galleryTitle').textContent=kind==='expense'?'Receipt photos':kind==='place'?'Place photos':'Item photos';$('gallery').showModal();updateGallery()}
function updateGallery(){if(!galleryPhotos.length)return;$('galleryImage').src=galleryPhotos[galleryIndex];$('galleryPosition').textContent=`${galleryIndex+1} / ${galleryPhotos.length}`;$('galleryPrev').disabled=galleryPhotos.length<2;$('galleryNext').disabled=galleryPhotos.length<2}

function delegate(e){const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;render();return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action,id=a.dataset.id;const [kind,recordId]=id.split(':');if(action==='goto'){view=id;render()}else if(action==='back'){if(id==='category')shopCategory=null;else{shopCategory=null;shopStore=null}render()}else if(action==='storepage'){shopStore=id;shopCategory=null;render()}else if(action==='folder'){shopCategory=id;render()}else if(action==='importitinerary')importSchedule(null).catch(err=>alert(err.message));else if(action==='importstop')importSchedule(id).catch(err=>alert(err.message));else if(action==='purchase')purchaseItem(id);else if(action==='add')openModal(id);else if(action==='edit')openModal(kind,recordId);else if(action==='delete')remove(kind,recordId).catch(err=>alert(err.message));else if(action==='gallery')showGallery(kind,recordId);else if(action==='backup')backup();else if(action==='restore')$('restoreInput').click();else if(action==='theme')changeTheme();else if(action==='refresh')fetchRate();else if(action==='swap'){const select=$('fromCurrency');select.value=select.value==='JPY'?'MYR':'JPY';select.dispatchEvent(new Event('change'))}else if(action==='receipt'){const rec=state.expenses.find(x=>x.id===id);if(rec?.receipt&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(rec.receipt)){const w=window.open("","_blank","noopener");if(w){const img=w.document.createElement("img");img.alt="Receipt";img.style.maxWidth="100%";img.src=rec.receipt;w.document.body.append(img)}else alert("Please allow pop-ups to view receipt")}}}
async function purchaseItem(id){const item=state.items.find(x=>x.id===id);if(!item)return;if(item.status==='Purchased'){if(!confirm('Move this item back to wishlist? Linked expenses will remain unchanged.'))return;item.status='Wishlist';try{await save();render()}catch(e){item.status='Purchased';alert('Could not save: '+e.message)}return}const previous=item.status;item.status='Purchased';try{await save();render()}catch(e){item.status=previous;alert('Could not save: '+e.message);return}if(confirm('Purchased! Would you like to record this expense and attach a receipt now?')){pendingPurchase=id;openModal('expense');const f=$('entryForm');f.elements.namedItem('store').value=storeName(item.storeId);f.elements.namedItem('amount').value=num(item.price)*num(item.qty||1);f.elements.namedItem('currency').value=item.currency;f.elements.namedItem('category').value=categoryName(item.categoryId);f.elements.namedItem('itemId').value=item.id}}
function attach(){document.addEventListener('click',delegate);window.addEventListener('online',()=>{if(!state.rate||state.rate.date!==today())fetchRate()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&navigator.onLine&&(!state.rate||state.rate.date!==today()))fetchRate()});$('galleryClose').onclick=()=>$('gallery').close();$('galleryPrev').onclick=()=>moveGallery(-1);$('galleryNext').onclick=()=>moveGallery(1);let touchX=null;$('galleryStage').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});$('galleryStage').addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)moveGallery(dx<0?1:-1);touchX=null},{passive:true});$('quick').onclick=()=>{const choices=[['item','🛍 Shopping item'],['place','📍 Place / experience'],['expense','🧾 Expense / receipt'],['preparation','✈ Preparation'],['store','🏬 Store'],['category','📂 Category'],['packing','🧳 Packing'],['checklist','☑️ Before-trip task'],['note','📝 Note']];$('quickChoices').innerHTML=choices.map(([kind,label])=>`<button type="button" class="secondary" data-quick="${kind}">${label}</button>`).join('');$('quickMenu').showModal()};$('quickClose').onclick=()=>$('quickMenu').close();$('quickChoices').onclick=e=>{const b=e.target.closest('[data-quick]');if(!b)return;$('quickMenu').close();openModal(b.dataset.quick)};$('themeButton').onclick=changeTheme;$('cancel').onclick=()=>$('modal').close();$('entryForm').onsubmit=submitForm;$('restoreInput').onchange=async e=>{try{await restore(e.target.files[0])}catch(err){alert('Restore failed: '+err.message)}finally{e.target.value=''}};document.addEventListener('toggle',e=>{const d=e.target;if(d.matches?.('details[data-category]')){if(d.open)openCategories.add(d.dataset.category);else openCategories.delete(d.dataset.category)}},true);document.addEventListener('change',async e=>{if(e.target.dataset.purchase){const item=state.items.find(x=>x.id===e.target.dataset.purchase);if(!item)return;const previous=item.status;item.status=e.target.checked?'Purchased':'Wishlist';e.target.disabled=true;try{await save();render()}catch(err){item.status=previous;e.target.disabled=false;e.target.checked=previous==='Purchased';alert('Could not update item: '+err.message)}return}if(e.target.dataset.before){const item=state.checklist.find(x=>x.id===e.target.dataset.before);if(item){const old=item.done;item.done=e.target.checked;try{await save();render()}catch(err){item.done=old;alert('Could not save: '+err.message)}}return}if(e.target.dataset.pack){const p=state.packing.find(x=>x.id===e.target.dataset.pack);if(p){p.packed=e.target.checked;try{await save();render()}catch(err){alert(err.message)}}}});document.addEventListener('input',e=>{if(e.target.id==='shopSearch'){window.searchText=e.target.value;filterShop()}if(e.target.id==='expenseSearch'){let q=e.target.value.toLowerCase();$('expenseResults').innerHTML=expenseRows(state.expenses.filter(x=>[x.store,x.category,x.notes].join(' ').toLowerCase().includes(q)))}});document.addEventListener('change',e=>{if(['statusFilter','sortFilter'].includes(e.target.id))filterShop()})}
function filterShop(){const q=($('shopSearch')?.value||'').toLowerCase(),status=$('statusFilter')?.value,sort=$('sortFilter')?.value;let items=state.items.filter(x=>[x.name,storeName(x.storeId),categoryName(x.categoryId),x.notes].join(' ').toLowerCase().includes(q)&&(!status||x.status===status));items.sort((a,b)=>sort==='price'?num(a.price)-num(b.price):String(sort==='status'?a.status:a.name).localeCompare(String(sort==='status'?b.status:b.name)));$('shopResults').innerHTML=shopResults(items)}
(async()=>{try{db=await openDb();const existing=await readDb();if(existing){state=normalize(existing)}else await save();document.body.className=state.settings.theme==='lavender'?'':state.settings.theme;attach();render();if(navigator.onLine&&(!state.rate||state.rate.date!==today()))fetchRate();else if(state.rate){rateStatus='Offline saved rate · '+state.rate.date}if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('view').innerHTML='<section class="card"><h2>Storage unavailable</h2><p>Open this website in normal Safari or Chrome (not private browsing). Your browser must support IndexedDB.</p><p class="muted">'+esc(e.message)+'</p></section>'; $('quick').disabled=true}})();
