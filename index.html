<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7053ba"><meta name="apple-mobile-web-app-capable" content="yes"><title>Trip List 3.1</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#302449;background:#f7f4ff;--bg:#f7f4ff;--card:#fff;--ink:#302449;--muted:#716783;--accent:#7053ba;--border:#e9e2f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}body.dark{--bg:#171222;--card:#292038;--ink:#f4edff;--muted:#c0b3d4;--accent:#ad90f5;--border:#453654}body.pink{--bg:#fff3f7;--card:#fff;--ink:#543342;--muted:#886575;--accent:#c65d92;--border:#f1dbe5}body.neutral{--bg:#f6f5f2;--card:#fff;--ink:#353333;--muted:#72706c;--accent:#66615a;--border:#e7e5e1}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button,.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--accent);color:white;font-weight:650}button.secondary{background:var(--card);color:var(--ink);border:1px solid var(--border)}button.danger{background:#aa3453}button.small{padding:7px 10px;font-size:12px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e2bbff;outline-offset:2px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink);min-width:0}textarea{min-height:90px}label{font-size:13px;font-weight:650;display:grid;gap:6px}h1{font-size:27px;margin:0}h2{font-size:20px;margin:0 0 13px}h3{font-size:16px;margin:0}p{margin:7px 0;line-height:1.5}.muted{color:var(--muted);font-size:13px}.app{max-width:940px;margin:auto;padding:20px 16px 110px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #3c22650b}.hero{background:linear-gradient(125deg,#62419f,#9472cf);color:white}.hero .muted{color:#e9dfff}.hero strong{font-size:30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{flex:1 1 125px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--bg);color:var(--muted);font-size:12px}.progress{height:9px;border-radius:20px;background:#c9b9df;overflow:hidden}.progress>div{height:100%;background:#aa8be8}.item{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);padding:13px 0}.item:first-child{border-top:0}.thumb{height:58px;width:58px;border-radius:12px;object-fit:cover;background:var(--bg);flex-shrink:0}.grow{flex:1;min-width:0}.truncate{overflow-wrap:anywhere}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{background:transparent;color:var(--muted);padding:9px 4px;min-width:0;flex:1;max-width:140px;font-size:11px;border-radius:12px}.nav button.active{background:var(--bg);color:var(--accent)}.nav span{display:block;font-size:20px;margin-bottom:3px}.fab{position:fixed;bottom:90px;right:20px;border-radius:50%;height:56px;width:56px;font-size:26px;z-index:9;box-shadow:0 6px 20px #45315d55}dialog{width:min(95vw,560px);max-height:85dvh;overflow:auto;border:1px solid var(--border);border-radius:22px;background:var(--card);color:var(--ink);padding:20px}dialog::backdrop{background:#160d2b99}dialog form{display:grid;gap:13px}dialog h2{margin:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.notice{border-left:4px solid #d58b2c;padding:10px;background:var(--bg);border-radius:8px}.empty{text-align:center;padding:28px;color:var(--muted)}.mini{font-size:12px}.receipt{width:64px;height:64px;object-fit:cover;border-radius:10px}a{color:var(--accent)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app{padding-top:32px}.nav{max-width:940px;margin:auto;border-radius:18px 18px 0 0}}@media(max-width:360px){.app{padding:14px 10px 110px}.card{padding:13px}.two{grid-template-columns:1fr}}
</style></head><body><main class="app"><header><div><div class="muted">YOUR PERSONAL TRAVEL COMPANION</div><h1>Trip List ✨</h1></div><button class="secondary" id="themeButton" aria-label="Change theme">🎨 Theme</button></header><div id="view"></div></main><button class="fab" id="quick" aria-label="Quick add">+</button><nav class="nav" id="nav" aria-label="Main navigation"></nav><dialog id="modal"><form id="entryForm"><h2 id="modalTitle"></h2><div id="fields" class="stack"></div><div class="row between"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" id="submit">Save</button></div></form></dialog><input type="file" id="restoreInput" accept="application/json,.json" hidden><script>
'use strict';
const DB='trip-list-v3',VERSION=1,STORE='records',MAX_FILE=5*1024*1024,MAX_BACKUP=35*1024*1024;
let db,view='home',state={settings:{budget:3400,tripDate:'',tripEndDate:'',dailyFoodMYR:80,cashJPY:0,cashMYR:0,wiseMYR:0,theme:'lavender'},stores:[],categories:[],items:[],expenses:[],packing:[],notes:[],preparations:[],rate:null},editing=null,modalKind='',rateStatus='Not fetched';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,c='MYR')=>new Intl.NumberFormat('en-MY',{style:'currency',currency:c,maximumFractionDigits:c==='JPY'?0:2}).format(Number(n)||0);
const num=n=>Number.isFinite(Number(n))?Number(n):0,uid=()=>crypto.randomUUID(),today=()=>new Date().toLocaleDateString('en-CA');
const fields={store:[['name','Store name','text'],['budget','Store budget (RM)','number']],category:[['storeId','Store','store'],['name','Category name','text']],item:[['storeId','Store','store'],['categoryId','Category','category'],['name','Item name','text'],['price','Unit price','number'],['currency','Currency','currency'],['qty','Quantity','number'],['status','Status','status'],['image','Item photo','image'],['notes','Notes','textarea']],expense:[['store','Store / merchant','text'],['date','Purchase date','date'],['amount','Amount','number'],['currency','Currency','currency'],['category','Expense category','text'],['method','Payment method / money source','method'],['itemId','Linked wishlist item (optional)','item'],['receipt','Receipt photo','image'],['notes','Notes','textarea']],preparation:[['name','To prepare / book','text'],['estimated','Estimated amount','number'],['actual','Actual amount (optional)','number'],['currency','Currency','currency'],['status','Preparation status','prepstatus'],['due','Due date','date'],['notes','Notes','textarea']],packing:[['name','Packing item','text'],['packed','Packed','check']],note:[['title','Title','text'],['body','Details','textarea']],settings:[['budget','Total trip budget (RM)','number'],['tripDate','Departure date','date'],['tripEndDate','Return date','date'],['dailyFoodMYR','Daily food budget (RM)','number'],['cashJPY','Starting cash in Japan (JPY)','number'],['cashMYR','Starting cash in Malaysia (MYR)','number'],['wiseMYR','Starting Wise balance (RM equivalent)','number']]};
function openDb(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readDb(){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function save(){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(state,'data');t.oncomplete=resolve;t.onerror=()=>reject(t.error||new Error('Storage failed'));t.onabort=()=>reject(t.error||new Error('Storage aborted'))})}
function normalize(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Invalid backup');const result={settings:{...state.settings,...raw.settings}};for(const key of ['stores','categories','items','expenses','packing','notes','preparations']){if(!Array.isArray(raw[key]??(key==='preparations'?[]:null))||(raw[key]??[]).length>10000)throw Error('Invalid '+key);result[key]=(raw[key]??[]).map(x=>{if(!x||typeof x!=='object'||typeof x.id!=='string'||x.id.length>100)return (()=>{throw Error('Invalid record')})();return {...x}})}if(raw.rate&&typeof raw.rate==='object'&&num(raw.rate.value)>0)result.rate=raw.rate;else result.rate=null;return result}
function calcRM(amount,currency){return currency==='JPY'?(state.rate?.value?num(amount)*state.rate.value:0):num(amount)}
function spent(){return state.expenses.reduce((s,x)=>s+calcRM(x.amount,x.currency),0)}
function storeName(id){return state.stores.find(x=>x.id===id)?.name||'Unassigned'}
function categoryName(id){return state.categories.find(x=>x.id===id)?.name||'Uncategorized'}
function imageTag(data,cl='thumb'){return typeof data==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(data)?`<img class="${cl}" src="${data}" alt="Uploaded photo">`:`<div class="${cl}" style="display:grid;place-items:center">🛍️</div>`}
function button(action,id,label,klass='secondary'){return `<button type="button" class="${klass} small" data-action="${esc(action)}" data-id="${esc(id)}">${esc(label)}</button>`}
function nav(){const tabs=[['home','⌂','Home'],['shop','🛍','Shop'],['convert','⇄','Convert'],['expenses','▤','Spent'],['ready','✈','Ready'],['more','☰','More']];$('nav').innerHTML=tabs.map(([id,icon,label])=>`<button data-view="${id}" class="${view===id?'active':''}"><span>${icon}</span>${label}</button>`).join('')}
function render(){nav();const views={home:homeView,shop:shopView,convert:convertView,expenses:expenseView,ready:readyView,more:moreView};$('view').innerHTML=views[view]();if(view==='convert')wireConverter()}
function homeView(){const s=spent(),budget=num(state.settings.budget),remaining=budget-s,days=state.settings.tripDate?Math.ceil((new Date(state.settings.tripDate+'T00:00:00').getTime()-Date.now())/86400000):null;return `<section class="card hero"><p class="muted">Total trip budget</p><strong>${money(budget)}</strong><p>${money(s)} spent · ${money(remaining)} remaining</p><div class="progress"><div style="width:${budget?Math.min(100,Math.max(0,s/budget*100)):0}%"></div></div></section>${remaining<0?'<p class="notice">⚠️ You have exceeded your trip budget.</p>':''}<div class="grid"><div class="card"><p class="muted">Shopping list</p><h2>${state.items.length} items</h2><p class="muted">${state.items.filter(x=>x.status==='Purchased').length} purchased</p></div><div class="card"><p class="muted">Receipts & expenses</p><h2>${state.expenses.length}</h2><p class="muted">Actual spending only</p></div><div class="card"><p class="muted">Trip countdown</p><h2>${days===null?'Not set':days>0?days+' days':days===0?'Today!':'Trip started'}</h2><p class="muted">${esc(state.settings.tripDate||'Set departure in Settings')}</p></div></div><section class="card"><h2>Quick actions</h2><div class="row">${button('add','item','+ Shopping item')}${button('add','expense','+ Expense')}${button('add','preparation','+ To prepare')}</div></section><section class="card"><h2>Latest expenses</h2>${state.expenses.slice(-4).reverse().map(x=>`<div class="item"><div class="grow"><strong>${esc(x.store)}</strong><div class="muted">${esc(x.date)} · ${esc(x.category)}</div></div><strong>${money(x.amount,x.currency)}</strong></div>`).join('')||'<div class="empty">No expenses yet</div>'}</section>`}
function shopView(){let q=esc($('searchCache')?.value||'');const filtered=state.items.filter(x=>{let text=[x.name,storeName(x.storeId),categoryName(x.categoryId),x.notes].join(' ').toLowerCase();return !q||text.includes(q.toLowerCase())});return `<div class="row between"><h2>Shopping planner</h2>${button('add','store','+ Store')}</div><div class="toolbar">${button('add','category','+ Category')}${button('add','item','+ Item')}</div><div class="card"><label>Search items<input id="shopSearch" type="search" placeholder="Search store, category, item..." value="${q}"></label><div class="two" style="margin-top:10px"><label>Status<select id="statusFilter"><option value="">All statuses</option><option>Wishlist</option><option>Purchased</option><option>Skipped</option></select></label><label>Sort<select id="sortFilter"><option value="name">Name</option><option value="price">Price</option><option value="status">Status</option></select></label></div></div><div id="shopResults">${shopResults(filtered)}</div>`}
function shopResults(items){return state.stores.map(store=>{const si=items.filter(x=>x.storeId===store.id),all=state.items.filter(x=>x.storeId===store.id),planned=all.filter(x=>x.status!=='Skipped').reduce((s,x)=>s+calcRM(num(x.price)*num(x.qty||1),x.currency),0),limit=num(store.budget);return `<section class="card"><div class="row between"><h2>${esc(store.name)}</h2><div class="row">${button('edit','store:'+store.id,'Edit')}${button('delete','store:'+store.id,'Delete','danger')}</div></div><p class="muted">Planned ${money(planned)} / ${limit?money(limit):'No store budget'} · ${all.length} items</p>${limit&&planned>limit?'<p class="notice">⚠️ Store plan exceeds budget</p>':''}${state.categories.filter(c=>c.storeId===store.id).map(c=>`<div style="margin-top:15px"><div class="row between"><h3>${esc(c.name)}</h3><div class="row">${button('edit','category:'+c.id,'Edit')}${button('delete','category:'+c.id,'Delete','danger')}</div></div>${si.filter(x=>x.categoryId===c.id).map(itemRow).join('')||'<p class="muted">No matching items</p>'}</div>`).join('')}${si.filter(x=>!state.categories.some(c=>c.id===x.categoryId&&c.storeId===store.id)).map(itemRow).join('')}</section>`}).join('')||'<div class="card empty">Start by adding a store, then categories and items.</div>'}
function itemRow(x){return `<div class="item">${imageTag(x.image)}<div class="grow truncate"><strong>${esc(x.name)}</strong><div class="muted">${money(x.price,x.currency)} × ${num(x.qty||1)} · ${esc(x.status||'Wishlist')}</div></div><div class="stack">${button('edit','item:'+x.id,'Edit')}${button('delete','item:'+x.id,'Delete','danger')}</div></div>`}
function convertView(){return `<section class="card"><h2>Instant currency converter</h2><p class="muted" id="rateLabel">${esc(rateStatus)}</p><div class="stack"><label>From currency<select id="fromCurrency"><option value="JPY">Japanese Yen (JPY)</option><option value="MYR">Malaysian Ringgit (MYR)</option></select></label><label>Amount<input id="fromAmount" type="number" min="0" step="any" inputmode="decimal" value="1000"></label><div class="row">${button('swap','currency','⇅ Swap currencies')}${button('refresh','rate','↻ Refresh rate')}</div><div class="card" style="background:var(--bg)"><p class="muted">Converted amount</p><h1 id="converted">—</h1></div></div><p class="muted">Reference exchange rates only. Your card or cash provider may charge different rates or fees. Last saved rate is available offline.</p></section>`}
function expenseView(){return `<div class="row between"><h2>Expense journal</h2>${button('add','expense','+ Expense')}</div><section class="card hero"><p class="muted">Actual recorded spending</p><strong>${money(spent())}</strong><p class="muted">JPY expenses require a saved conversion rate for RM totals.</p></section><div class="card"><label>Search expenses<input id="expenseSearch" placeholder="Merchant, category, notes..." type="search"></label><div id="expenseResults">${expenseRows(state.expenses)}</div></div>`}
function expenseRows(items){return items.slice().reverse().map(x=>`<div class="item">${imageTag(x.receipt,'receipt')}<div class="grow truncate"><strong>${esc(x.store||'Expense')}</strong><div class="muted">${esc(x.date)} · ${esc(x.category||'Other')}</div><div class="mini">${x.itemId?'Linked: '+esc(state.items.find(i=>i.id===x.itemId)?.name||'Deleted item'):''}</div><strong>${money(x.amount,x.currency)}</strong></div><div class="stack">${button('edit','expense:'+x.id,'Edit')}${button('delete','expense:'+x.id,'Delete','danger')}${x.receipt?button('receipt',x.id,'View'):''}</div></div>`).join('')||'<div class="empty">No recorded expenses yet</div>'}

function readyView(){
 const rate=state.rate?.value||0, converted=(amount,currency)=>currency==='JPY'?rate?num(amount)*rate:null:num(amount);
 const paid={jpy:0,myr:0,wise:0};
 for(const x of state.expenses){const method=x.method||'';if(method==='Cash JPY')paid.jpy+=x.currency==='JPY'?num(x.amount):rate?num(x.amount)/rate:0;else if(method==='Cash MYR')paid.myr+=x.currency==='MYR'?num(x.amount):converted(x.amount,x.currency)||0;else if(method==='Wise')paid.wise+=x.currency==='MYR'?num(x.amount):converted(x.amount,x.currency)||0;}
 const jpy=num(state.settings.cashJPY)-paid.jpy,myr=num(state.settings.cashMYR)-paid.myr,wise=num(state.settings.wiseMYR)-paid.wise;
 const total=rate?jpy*rate+myr+wise:null;
 const start=state.settings.tripDate,end=state.settings.tripEndDate,days=start&&end?Math.max(0,Math.round((new Date(end+'T00:00:00')-new Date(start+'T00:00:00'))/86400000)+1):0;
 const food=num(state.settings.dailyFoodMYR),foodSpent=state.expenses.filter(x=>String(x.category).toLowerCase().includes('food')).reduce((sum,x)=>sum+calcRM(x.amount,x.currency),0);
 return `<div class="row between"><h2>✈ Trip Ready & Money</h2>${button('add','settings','Edit money')}</div><section class="card hero"><p class="muted">Estimated available money</p><strong>${total===null?'Rate needed':money(total)}</strong><p>Based on starting balances minus expenses assigned to each source</p></section>
 <div class="grid"><div class="card"><p class="muted">💴 Japan cash</p><h2>${money(jpy,'JPY')}</h2><p class="muted">${rate?money(jpy*rate):'JPY to MYR rate unavailable'}</p></div><div class="card"><p class="muted">💳 Wise (RM equivalent)</p><h2>${money(wise)}</h2></div><div class="card"><p class="muted">💵 MYR cash</p><h2>${money(myr)}</h2></div></div>
 ${(jpy<0||myr<0||wise<0)?'<p class="notice">⚠️ A money source is below zero. Check recorded expenses or starting balances.</p>':''}
 <section class="card"><h2>🍱 Daily food budget</h2><div class="grid"><div><p class="muted">Per day</p><h2>${money(food)}</h2><p class="muted">${rate?money(food/rate,'JPY'):'JPY estimate unavailable'}</p></div><div><p class="muted">Trip allowance (${days||'—'} days)</p><h2>${days?money(days*food):'Set trip dates'}</h2><p class="muted">Food expenses: ${money(foodSpent)}</p></div></div>${days?`<p class="muted">Food allowance remaining: ${money(days*food-foodSpent)}</p>`:''}</section>
 <section class="card"><div class="row between"><h2>📋 To prepare / book</h2>${button('add','preparation','+ Add')}</div>${state.preparations.map(x=>`<div class="item"><div class="grow"><strong>${esc(x.name)}</strong><div class="muted">${esc(x.status||'To do')} · ${esc(x.due||'No due date')}</div><div class="mini">Estimate ${money(x.estimated,x.currency)}${num(x.actual)>0?' · Actual '+money(x.actual,x.currency):''}</div>${x.notes?`<p class="muted">${esc(x.notes)}</p>`:''}</div><div class="stack">${button('edit','preparation:'+x.id,'Edit')}${button('delete','preparation:'+x.id,'Delete','danger')}</div></div>`).join('')||'<p class="muted">Add eSIM, return bus, airport transfer, insurance, or anything else.</p>'}<p class="muted">Preparation estimates are plans, not actual expenses. Add paid purchases to the Expense Journal to deduct money.</p></section>
 <section class="card"><h2>How balances work</h2><p class="muted">Enter starting cash and Wise balances in Edit money. Record purchases under Cash JPY, Cash MYR or Wise to subtract them. Card/Other spending is tracked in expenses but not deducted from these balances. Currency conversion uses the saved reference rate, not Wise's actual rate. Transfers or top-ups require adjusting starting balances; this is a planning tracker, not a bank connection.</p></section>`;
}
function moreView(){return `<section class="card"><h2>🧳 Packing checklist</h2>${button('add','packing','+ Packing item')}<div>${state.packing.map(x=>`<div class="item"><input type="checkbox" style="width:22px" data-pack="${esc(x.id)}" ${x.packed?'checked':''} aria-label="Packed ${esc(x.name)}"><div class="grow" style="${x.packed?'text-decoration:line-through':''}">${esc(x.name)}</div>${button('delete','packing:'+x.id,'Delete','danger')}</div>`).join('')||'<p class="muted">Nothing added yet.</p>'}</div></section><section class="card"><h2>📝 Travel notes</h2>${button('add','note','+ Note')}${state.notes.map(x=>`<div class="item"><div class="grow"><strong>${esc(x.title)}</strong><p class="muted" style="white-space:pre-wrap">${esc(x.body)}</p></div>${button('edit','note:'+x.id,'Edit')}${button('delete','note:'+x.id,'Delete','danger')}</div>`).join('')}</section><section class="card"><h2>⚙️ Settings</h2><p class="muted">Budget, departure date, and appearance</p><div class="row">${button('add','settings','Edit settings')}${button('theme','all','Change theme')}</div></section><section class="card"><h2>💾 Backup & restore</h2><p class="muted">Backup includes photos and receipts. Store your backup securely; it contains personal spending details.</p><div class="row">${button('backup','all','Download backup')}${button('restore','all','Restore backup')}</div><p class="muted">Restore replaces all existing data. Browser storage can be deleted; keep backups outside Safari.</p></section>`}
function fieldHtml([key,label,type],obj){const v=obj?.[key]??(key==='qty'?1:key==='currency'?'JPY':key==='status'?(type==='prepstatus'?'To do':'Wishlist'):key==='method'?'Wise':key==='date'?today():'');let control='';if(type==='store')control=`<select name="${key}" required><option value="">Choose store</option>${state.stores.map(s=>`<option value="${esc(s.id)}" ${s.id===v?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;else if(type==='category')control=`<select name="${key}"><option value="">Uncategorized</option>${state.categories.filter(c=>!obj?.storeId||c.storeId===obj.storeId).map(c=>`<option value="${esc(c.id)}" ${c.id===v?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;else if(type==='item')control=`<select name="${key}"><option value="">No linked item</option>${state.items.map(i=>`<option value="${esc(i.id)}" ${i.id===v?'selected':''}>${esc(i.name)} (${esc(storeName(i.storeId))})</option>`).join('')}</select>`;else if(type==='currency'||type==='status'||type==='method'){let options=type==='currency'?['JPY','MYR']:type==='status'?['Wishlist','Purchased','Skipped']:['Cash JPY','Cash MYR','Wise','Card','Other'];control=`<select name="${key}">${options.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`}else if(type==='prepstatus')control=`<select name="${key}">${['To do','Booked','Paid','Ready'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;else if(type==='textarea')control=`<textarea name="${key}">${esc(v)}</textarea>`;else if(type==='image')control=`<input name="${key}" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><span class="muted">JPEG, PNG or WebP, maximum 5 MB</span>${v?'<span class="muted">Current photo kept unless replaced</span>':''}`;else if(type==='check')control=`<input name="${key}" type="checkbox" style="width:25px" ${v?'checked':''}>`;else control=`<input name="${key}" type="${type}" value="${esc(v)}" ${type==='number'?'min="0" step="any" inputmode="decimal"':''} ${['name','amount','price','title','budget'].includes(key)?'required':''} ${key==='date'?'required':''}>`;return `<label>${esc(label)}${control}</label>`}
function openModal(kind,id=null){modalKind=kind;editing=id;const collection=kind==='preparation'?'preparations':kind==='note'?'notes':kind==='category'?'categories':kind==='store'?'stores':kind==='item'?'items':kind==='expense'?'expenses':kind==='packing'?'packing':null;const obj=kind==='settings'?state.settings:collection?state[collection].find(x=>x.id===id):null;$('modalTitle').textContent=(id?'Edit ':'Add ')+kind;$('fields').innerHTML=fields[kind].map(f=>fieldHtml(f,obj)).join('');$('modal').showModal();if(kind==='item'){$('fields').querySelector('[name=storeId]').addEventListener('change',e=>{const select=$('fields').querySelector('[name=categoryId]');select.innerHTML='<option value="">Uncategorized</option>'+state.categories.filter(c=>c.storeId===e.target.value).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')})}}
async function photo(file){if(!file)return null;if(file.size>MAX_FILE)throw Error('Image must be 5 MB or less');const bytes=new Uint8Array(await file.arrayBuffer());let mime='';if(bytes[0]===0xff&&bytes[1]===0xd8&&bytes[2]===0xff)mime='image/jpeg';else if(bytes[0]===0x89&&bytes[1]===0x50&&bytes[2]===0x4e&&bytes[3]===0x47)mime='image/png';else if(bytes.length>12&&String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')mime='image/webp';if(!mime)throw Error('Unsupported image content');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read image'));r.readAsDataURL(new Blob([bytes],{type:mime}))})}
async function submitForm(e){e.preventDefault();const btn=$('submit');btn.disabled=true;try{const form=e.target,obj=modalKind==='settings'?{...state.settings}:editing?{...state[modalKind==='preparation'?'preparations':modalKind==='note'?'notes':modalKind==='category'?'categories':modalKind==='store'?'stores':modalKind==='item'?'items':modalKind==='expense'?'expenses':'packing'].find(x=>x.id===editing)}:{id:uid()};for(const [key,,type] of fields[modalKind]){const el=form.elements.namedItem(key);if(type==='image'){if(el.files[0])obj[key]=await photo(el.files[0])}else if(type==='check')obj[key]=el.checked;else if(type==='number'){if(!Number.isFinite(Number(el.value))||Number(el.value)<0)throw Error('Invalid '+key);obj[key]=Number(el.value)}else obj[key]=el.value.trim()}if(modalKind==='preparation'){if(!obj.name||!['JPY','MYR'].includes(obj.currency)||!['To do','Booked','Paid','Ready'].includes(obj.status))throw Error('Invalid preparation item')}if(modalKind==='item'){if(!state.stores.some(s=>s.id===obj.storeId))throw Error('Select a valid store');if(obj.categoryId&&!state.categories.some(c=>c.id===obj.categoryId&&c.storeId===obj.storeId))throw Error('Category does not belong to selected store');if(!Number.isInteger(obj.qty)||obj.qty<1||obj.qty>9999)throw Error('Quantity must be 1–9999')}if(modalKind==='category'&&!state.stores.some(s=>s.id===obj.storeId))throw Error('Select a store');if(modalKind==='expense'){if(obj.itemId&&!state.items.some(i=>i.id===obj.itemId))throw Error('Linked item no longer exists');if(obj.itemId){const item=state.items.find(i=>i.id===obj.itemId);item.status='Purchased'}}if(modalKind==='settings')state.settings=obj;else{const key=modalKind==='preparation'?'preparations':modalKind==='note'?'notes':modalKind==='category'?'categories':modalKind==='store'?'stores':modalKind==='item'?'items':modalKind==='expense'?'expenses':'packing';if(editing)state[key]=state[key].map(x=>x.id===editing?obj:x);else state[key].push(obj)}await save();$('modal').close();render()}catch(err){alert('Could not save: '+err.message)}finally{btn.disabled=false}}
async function fetchRate(){rateStatus='Updating exchange rate...';if(view==='convert')render();try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);let data;try{const r=await fetch('https://latest.currency-api.pages.dev/v1/currencies/jpy.json',{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('Exchange service unavailable');data=await r.json()}finally{clearTimeout(timer)}const value=Number(data?.jpy?.myr);if(!(value>0&&value<1))throw Error('Invalid exchange rate');state.rate={value,date:String(data.date||today()).slice(0,10)};await save();rateStatus='Online reference rate · '+state.rate.date}catch(e){rateStatus=state.rate?'Offline saved rate · '+state.rate.date:'No exchange rate available · connect to internet'}if(view==='convert')render()}
function wireConverter(){if(state.rate&&rateStatus==='Not fetched')rateStatus='Saved rate · '+state.rate.date;$('rateLabel').textContent=rateStatus;const update=()=>{let v=Number($('fromAmount').value),c=$('fromCurrency').value;$('converted').textContent=!state.rate?'Rate unavailable':money(c==='JPY'?v*state.rate.value:v/state.rate.value,c==='JPY'?'MYR':'JPY')};$('fromAmount').addEventListener('input',update);$('fromCurrency').addEventListener('change',update);update()}
async function backup(){const blob=new Blob([JSON.stringify({app:'Trip List 3.0',version:1,exportedAt:new Date().toISOString(),data:state})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='trip-list-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),15000)}
async function restore(file){if(!file||file.size>MAX_BACKUP)throw Error('Backup exceeds 35 MB');const raw=JSON.parse(await file.text());if(raw.app!=='Trip List 3.0'||raw.version!==1)throw Error('Unsupported backup format');const restored=normalize(raw.data);if(!confirm('Replace ALL existing local data with this backup? This cannot be undone.'))return;const old=state;state=restored;try{await save()}catch(e){state=old;throw e}document.body.className=state.settings.theme==='lavender'?'':state.settings.theme;render();alert('Backup restored successfully')}
async function remove(kind,id){const key={preparation:'preparations',store:'stores',category:'categories',item:'items',expense:'expenses',packing:'packing',note:'notes'}[kind];if(!key)return;const dependencies=kind==='store'?(state.categories.some(x=>x.storeId===id)||state.items.some(x=>x.storeId===id)):kind==='category'?state.items.some(x=>x.categoryId===id):false;if(dependencies){alert('Remove related categories/items first.');return}if(!confirm('Delete this '+kind+'?'))return;state[key]=state[key].filter(x=>x.id!==id);await save();render()}
function changeTheme(){const themes=['lavender','pink','neutral','dark'];const next=themes[(themes.indexOf(state.settings.theme)+1)%themes.length];state.settings.theme=next;document.body.className=next==='lavender'?'':next;save().catch(e=>alert('Theme save failed: '+e.message));render()}
function delegate(e){const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;render();return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action,id=a.dataset.id;const [kind,recordId]=id.split(':');if(action==='add')openModal(id);else if(action==='edit')openModal(kind,recordId);else if(action==='delete')remove(kind,recordId).catch(err=>alert(err.message));else if(action==='backup')backup();else if(action==='restore')$('restoreInput').click();else if(action==='theme')changeTheme();else if(action==='refresh')fetchRate();else if(action==='swap'){const select=$('fromCurrency');select.value=select.value==='JPY'?'MYR':'JPY';select.dispatchEvent(new Event('change'))}else if(action==='receipt'){const rec=state.expenses.find(x=>x.id===id);if(rec?.receipt&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(rec.receipt)){const w=window.open("","_blank","noopener");if(w){const img=w.document.createElement("img");img.alt="Receipt";img.style.maxWidth="100%";img.src=rec.receipt;w.document.body.append(img)}else alert("Please allow pop-ups to view receipt")}}}
function attach(){document.addEventListener('click',delegate);$('quick').onclick=()=>{const kind=prompt('Quick add: type item, expense, preparation, packing, note, store, or category','item')?.toLowerCase().trim();if(fields[kind])openModal(kind)};$('themeButton').onclick=changeTheme;$('cancel').onclick=()=>$('modal').close();$('entryForm').onsubmit=submitForm;$('restoreInput').onchange=async e=>{try{await restore(e.target.files[0])}catch(err){alert('Restore failed: '+err.message)}finally{e.target.value=''}};document.addEventListener('change',async e=>{if(e.target.dataset.pack){const p=state.packing.find(x=>x.id===e.target.dataset.pack);if(p){p.packed=e.target.checked;try{await save();render()}catch(err){alert(err.message)}}}});document.addEventListener('input',e=>{if(e.target.id==='shopSearch'){window.searchText=e.target.value;filterShop()}if(e.target.id==='expenseSearch'){let q=e.target.value.toLowerCase();$('expenseResults').innerHTML=expenseRows(state.expenses.filter(x=>[x.store,x.category,x.notes].join(' ').toLowerCase().includes(q)))}});document.addEventListener('change',e=>{if(['statusFilter','sortFilter'].includes(e.target.id))filterShop()})}
function filterShop(){const q=($('shopSearch')?.value||'').toLowerCase(),status=$('statusFilter')?.value,sort=$('sortFilter')?.value;let items=state.items.filter(x=>[x.name,storeName(x.storeId),categoryName(x.categoryId),x.notes].join(' ').toLowerCase().includes(q)&&(!status||x.status===status));items.sort((a,b)=>sort==='price'?num(a.price)-num(b.price):String(sort==='status'?a.status:a.name).localeCompare(String(sort==='status'?b.status:b.name)));$('shopResults').innerHTML=shopResults(items)}
(async()=>{try{db=await openDb();const existing=await readDb();if(existing){state=normalize(existing)}else await save();document.body.className=state.settings.theme==='lavender'?'':state.settings.theme;attach();render();if(navigator.onLine)fetchRate();else if(state.rate){rateStatus='Offline saved rate · '+state.rate.date}if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('view').innerHTML='<section class="card"><h2>Storage unavailable</h2><p>Open this website in normal Safari or Chrome (not private browsing). Your browser must support IndexedDB.</p><p class="muted">'+esc(e.message)+'</p></section>'; $('quick').disabled=true}})();
</script></body></html>
